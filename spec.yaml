schemaVersion: "2"
kind: mixin
name: opencode-sandbox-kit
displayName: "OpenCode-Konfiguration"
description: "OpenCode, Context7 und IntelliJ MCP"

permissions:
  network:
    allow:
    - opencode.ai
    - "*.opencode.ai"
    - context7.com
    - "*.context7.com"
    # DeepSeek (OpenCode-Modell mit eigenem API-Key)
    - api.deepseek.com
    - "*.deepseek.com"
    # OpenRouter (OpenCode-Zusatz-Provider, API auf openrouter.ai)
    - openrouter.ai
    - "*.openrouter.ai"
    # Google Gemini (OpenCode-Zusatz-Provider, API auf generativelanguage.googleapis.com)
    - generativelanguage.googleapis.com
    # Anthropic (Claude Code)
    - anthropic.com
    - api.anthropic.com
    - "*.anthropic.com"
    - platform.claude.com
    - github.com
    - api.github.com
    - "*.github.com"
    - githubusercontent.com
    - objects.githubusercontent.com
    - "*.githubusercontent.com"
    - models.dev
    - registry.npmjs.org
    - dlcdn.apache.org
    # Apache Camel (Doku, Dependencies)
    - camel.apache.org
    - "*.camel.apache.org"
    # IntelliJ IDEA MCP Server (Windows Host via Docker Desktop DNS)
    - "localhost:64342"
    - "127.0.0.1:64342"
    - "host.docker.internal:64342"
    # Maven Central
    - maven.org
    - repo1.maven.org
    - "*.maven.org"
    # Spring
    - spring.io
    - repo.spring.io
    - "*.spring.io"
    - start.spring.io
    # Docker
    - docker.io
    - "*.docker.io"
    - docker.com
    - "*.docker.com"
    - download.docker.com
    - dl.k8s.io
    - get.helm.sh
    # Zusätzliche Container-Registries (Observability / GitHub Packages)
    - docker.elastic.co
    - cr.jaegertracing.io
    - ghcr.io
    # Private Maven- & Helm-Repositories
    - repo.repsy.io
    - jitpack.io
    - artifacts.cibseven.org
    - packages.scm-manager.org
    # Liberica JDK (Renovate Versions-API)
    - api.bell-sw.com
    # Ubuntu apt
    - archive.ubuntu.com
    - security.ubuntu.com
    # MongoDB apt (Helm-Test-Pod)
    - repo.mongodb.org
    # Python / PyPI
    - pypi.org
    - files.pythonhosted.org
    # Skills CLI
    - add-skill.vercel.sh
    # Web search (last resort, allow-list for websearch/webfetch provider)
    - "*.exa.ai"
    # Stack Overflow API (Fallback-Quelle bei spezifischen Fehlermeldungen)
    - api.stackexchange.com

credentials:
  - service: deepseek
    description: "DeepSeek API-Key (https://platform.deepseek.com/api_keys)"
    apiKey:
      name: DEEPSEEK_API_KEY
      proxyManaged: true
      inject:
        - domain: api.deepseek.com
          header: Authorization
          format: "Bearer %s"
  - service: context7
    description: "Context7 API-Key (https://context7.com/dashboard)"
    apiKey:
      name: CONTEXT7_API_KEY
      proxyManaged: true
      inject:
        - domain: context7.com
          header: Authorization
          format: "Bearer %s"
  - service: stackoverflow
    description: "Stack Overflow API-Key (https://stackapps.com/applications)"
    apiKey:
      name: STACKOVERFLOW_API_KEY
      proxyManaged: true
      inject:
        - domain: api.stackexchange.com
          header: Authorization
          format: "Bearer %s"

setup:
  install:
    - command: "npm_config_bin_links=true npm install -g ctx7"
    - command: "npm_config_bin_links=true npm install -g skills"
    - command: "npm_config_bin_links=true npm install -g prettier"
    - command: "npm_config_bin_links=true npm install -g renovate"
    - command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y jq python3-yaml"
    - command: |
        SHFMT_VER="3.13.0" && \
        curl -fsSL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VER}/shfmt_v${SHFMT_VER}_linux_amd64" -o /usr/local/bin/shfmt && \
        chmod +x /usr/local/bin/shfmt && \
        shfmt --version
    - command: "sh -c 'export PATH=/usr/local/share/npm-global/bin:/usr/local/bin:/usr/bin:/bin:$PATH; /usr/local/share/npm-global/bin/skills add -g -y --all https://github.com/dboeckli/ai-agent-skills.git'"
      user: "1000"
    - command: |
        git clone --depth 1 https://github.com/dboeckli/ai-agent-skills.git /tmp/ai-agent-skills && \
        mkdir -p ~/.claude && \
        cp /tmp/ai-agent-skills/scripts/statusline.sh ~/.claude/statusline.sh && \
        chmod +x ~/.claude/statusline.sh && \
        rm -rf /tmp/ai-agent-skills
      user: "1000"
    - command: |
        LIBERICA_VER="25.0.4+9" && \
        curl -fsSL "https://github.com/bell-sw/Liberica/releases/download/${LIBERICA_VER}/bellsoft-jdk${LIBERICA_VER}-linux-amd64.tar.gz" -o /tmp/jdk.tar.gz && \
        mkdir -p /usr/local/java && \
        tar -xzf /tmp/jdk.tar.gz -C /usr/local/java --strip-components=1 && \
        ln -sf /usr/local/java/bin/java /usr/local/bin/java && \
        rm -f /tmp/jdk.tar.gz
    - command: |
        MAVEN_VER="3.9.16" && \
        curl -fsSL "https://dlcdn.apache.org/maven/maven-3/${MAVEN_VER}/binaries/apache-maven-${MAVEN_VER}-bin.tar.gz" -o /tmp/maven.tar.gz && \
        mkdir -p /opt/maven && \
        tar -xzf /tmp/maven.tar.gz -C /opt/maven --strip-components=1 && \
        rm -f /tmp/maven.tar.gz && \
        ln -sf /opt/maven/bin/mvn /usr/local/bin/mvn
    - command: |
        DOCKER_VER="27.5.1" && \
        curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_VER}.tgz" -o /tmp/docker.tgz && \
        tar -xzf /tmp/docker.tgz -C /usr/local/bin --strip-components=1 docker/docker && \
        rm -f /tmp/docker.tgz
    - command: |
        COMPOSE_VER="5.4.0" && \
        mkdir -p /usr/local/lib/docker/cli-plugins && \
        curl -fsSL "https://github.com/docker/compose/releases/download/v${COMPOSE_VER}/docker-compose-linux-x86_64" -o /usr/local/lib/docker/cli-plugins/docker-compose && \
        chmod +x /usr/local/lib/docker/cli-plugins/docker-compose && \
        docker compose version
    - command: |
        KUBE_VER=$(curl -fsSL https://dl.k8s.io/release/stable.txt) && \
        curl -fsSL "https://dl.k8s.io/release/$KUBE_VER/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl && \
        chmod +x /usr/local/bin/kubectl
    - command: |
        HELM_VER="3.21.3" && \
        curl -fsSL "https://get.helm.sh/helm-v${HELM_VER}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz && \
        mkdir -p /tmp/helm-extract && \
        tar -xzf /tmp/helm.tar.gz -C /tmp/helm-extract && \
        HELM_BIN=$(find /tmp/helm-extract -name helm -type f | head -1) && \
        mv "$HELM_BIN" /usr/local/bin/helm && \
        rm -rf /tmp/helm.tar.gz /tmp/helm-extract && \
        helm version
    - command: |
        mkdir -p /etc/claude-code && \
        cat > /etc/claude-code/managed-settings.json <<'EOF'
        {
          "statusLine": {
            "type": "command",
            "command": "bash ~/.claude/statusline.sh"
          },
          "hooks": {
            "PreToolUse": [
              {
                "matcher": "mcp__idea__execute_run_configuration",
                "hooks": [
                  {
                    "type": "command",
                    "command": "bash ~/.config/sandbox-kit/intellij-run-config-guard.sh"
                  }
                ]
              }
            ],
            "SessionStart": [
              {
                "matcher": "*",
                "hooks": [
                  {
                    "type": "command",
                    "command": "bash ~/.config/sandbox-kit/run-checks-hook.sh"
                  }
                ]
              }
            ]
          }
        }
        EOF
      description: Write managed-settings.json to /etc/claude-code — highest precedence, not overwritten by the template (statusLine + PreToolUse/SessionStart hooks always configured at session start)
  startup:
    - command:
        - python3
        - -c
        - |
          import json, os
          sf = os.path.expanduser('~/.claude/settings.json')
          kf = os.path.expanduser('~/.claude/settings.kit.json')
          if not (os.path.exists(sf) and os.path.exists(kf)):
              exit(0)
          with open(sf) as f: base = json.load(f)
          with open(kf) as f: kit = json.load(f)
          def merge(b, o):
              r = dict(b)
              for k, v in o.items():
                  if k in r and isinstance(r[k], dict) and isinstance(v, dict):
                      r[k] = merge(r[k], v)
                  else:
                      r[k] = v
              return r
          with open(sf, 'w') as f:
              json.dump(merge(base, kit), f, indent=2)
      user: "1000"
      description: Re-apply kit settings after template overwrite — Python merge (faster than jq, handles arrays correctly)

environment:
  variables:
    JAVA_HOME: "/usr/local/java"
    ANTHROPIC_DEFAULT_SONNET_MODEL: "claude-sonnet-4-6"
    ANTHROPIC_MODEL: "claude-sonnet-4-6"
    npm_config_bin_links: "false"