# syntax=docker/sandbox-kit:3
#
# Mammouth Code as a v3 sandbox workload (issue #240).
# Descriptor + Dockerfile share the stem: mammouth-agent.yaml + mammouth-agent.dockerfile.
# Build/publish: docker buildx build ./mammouth-agent -f ./mammouth-agent/mammouth-agent.yaml
# (multi-arch via .github/workflows/build-and-publish-mammouth-image.yml).
#
# v3 requires sbx >= v0.45 (repo pin: v0.51.0). v3 kits cannot compose with
# v1/v2 kits, so this workload is standalone (--template does not apply).

schemaVersion: "3"
kind: workload
displayName: Mammouth Code
description: >-
  Mammouth Code (OpenCode-Fork) with the kit tooling, MCP gateway wiring and
  proxy-managed provider credentials.

args:
  version:
    default: "1.18.31.2"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
    description: Mammouth Code version to install (install.sh pin)
    buildArg: MAMMOUTH_VERSION

provides: ["mammouth@${{ kit.args.version }}"]

dockerfile: ./mammouth-agent.dockerfile

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow: &allow
          - context7.com:443
          - '*.context7.com:443'
          - mammouth.ai:443
          - api.mammouth.ai:443
          - '*.mammouth.ai:443'
          - code.mammouth.ai:443
          - model-explorer.mammouth.ai:443
          - api.deepseek.com:443
          - '*.deepseek.com:443'
          - api.mistral.ai:443
          - api.eu.mistral.ai:443
          - docs.mistral.ai:443
          - api.z.ai:443
          - '*.z.ai:443'
          - openai.com:443
          - '*.openai.com:443'
          - api.github.com:443
          - github.com:443
          - '*.github.com:443'
          - codeberg.org:443
          - '*.codeberg.org:443'
          - maven.pkg.github.com:443
          - objects.githubusercontent.com:443
          - githubusercontent.com:443
          - '*.githubusercontent.com:443'
          - models.dev:443
          - registry.npmjs.org:443
          - nodejs.org:443
          - dlcdn.apache.org:443
          - archive.apache.org:443
          - camel.apache.org:443
          - '*.camel.apache.org:443'
          - jetbrains.com:443
          - www.jetbrains.com:443
          - plugins.jetbrains.com:443
          - youtrack.jetbrains.com:443
          - localhost:9200
          - 127.0.0.1:9200
          - host.docker.internal:9200
          - localhost:5601
          - 127.0.0.1:5601
          - host.docker.internal:5601
          - localhost:8200
          - 127.0.0.1:8200
          - host.docker.internal:8200
          - localhost:30920
          - 127.0.0.1:30920
          - localhost:30561
          - 127.0.0.1:30561
          - localhost:30820
          - 127.0.0.1:30820
          - repo1.maven.org:443
          - maven.org:443
          - '*.maven.org:443'
          - repo.spring.io:443
          - spring.io:443
          - '*.spring.io:443'
          - start.spring.io:443
          - docker.io:443
          - '*.docker.io:443'
          - docker.com:443
          - '*.docker.com:443'
          - download.docker.com:443
          - dl.k8s.io:443
          - get.helm.sh:443
          - docker.elastic.co:443
          - docker-auth.elastic.co:443
          - cr.jaegertracing.io:443
          - ghcr.io:443
          - repo.repsy.io:443
          - jitpack.io:443
          - artifacts.cibseven.org:443
          - packages.scm-manager.org:443
          - api.cloudsmith.io:443
          - upload.cloudsmith.io:443
          - docker.cloudsmith.io:443
          - helm.oci.cloudsmith.io:443
          - dl.cloudsmith.io:443
          - docs.cloudsmith.com:443
          - cloudsmith.com:443
          - www.cloudsmith.com:443
          - '**/*.r2.cloudflarestorage.com:443'
          - api.bell-sw.com:443
          - archive.ubuntu.com
          - security.ubuntu.com
          - ports.ubuntu.com
          - repo.mongodb.org
          - pypi.org:443
          - files.pythonhosted.org:443
          - add-skill.vercel.sh:443
          - www.skills.sh:443
          - '*.exa.ai:443'
          - api.stackexchange.com:443
          - sonarcloud.io:443
          - '*.sonarcloud.io:443'
      runtime:
        allow: *allow

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Mammouth Code API-Key (https://mammouth.ai/app/account/settings/api)
    config:
      service: mammouth
      phase: runtime
      apiKey:
        name: MAMMOUTH_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.mammouth.ai, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: GitHub (gh/git) — proxy-managed token
    config:
      service: github
      phase: runtime
      apiKey:
        name: GH_TOKEN
        proxyManaged: true
        inject:
          - {domain: api.github.com, header: Authorization, format: "Bearer %s"}
          - {domain: github.com, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: DeepSeek API-Key (https://platform.deepseek.com/api_keys)
    config:
      service: deepseek
      phase: runtime
      apiKey:
        name: DEEPSEEK_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.deepseek.com, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Mistral API-Key (https://console.mistral.ai/)
    config:
      service: mistral
      phase: runtime
      apiKey:
        name: MISTRAL_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.mistral.ai, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Z.AI API-Key (https://z.ai/manage-apikey/apikey-list)
    config:
      service: zai
      phase: runtime
      apiKey:
        name: ZAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.z.ai, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Context7 API-Key (https://context7.com/dashboard)
    config:
      service: context7
      phase: runtime
      apiKey:
        name: CONTEXT7_API_KEY
        proxyManaged: true
        inject:
          - {domain: context7.com, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Stack Overflow API-Key (https://stackapps.com/applications)
    config:
      service: stackoverflow
      phase: runtime
      apiKey:
        name: STACKOVERFLOW_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.stackexchange.com, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Cloudsmith API-Key (https://cloudsmith.io/user/settings/api-keys/)
    config:
      service: cloudsmith
      phase: runtime
      apiKey:
        name: CLOUDSMITH_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.cloudsmith.io, header: X-Api-Key, format: "%s"}
          - {domain: upload.cloudsmith.io, header: X-Api-Key, format: "%s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: GitHub Packages Maven — klassisches PAT (nur read:packages)
    config:
      service: github-maven
      phase: runtime
      apiKey:
        name: GITHUB_MAVEN_TOKEN
        proxyManaged: true
        inject:
          - {domain: maven.pkg.github.com, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: SonarCloud API-Token (https://sonarcloud.io/account/security)
    config:
      service: sonarcloud
      phase: runtime
      apiKey:
        name: SONAR_TOKEN
        proxyManaged: true
        inject:
          - {domain: sonarcloud.io, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Codeberg API-Token (https://codeberg.org/user/settings/applications)
    config:
      service: codeberg
      phase: runtime
      apiKey:
        name: CODEBERG_TOKEN
        proxyManaged: true
        inject:
          - {domain: codeberg.org, header: Authorization, format: "token %s"}

  - type: com.docker.sandbox/agent-context@1
    optional: true
    config:
      filename: AGENTS.md
      directory: /home/agent/.config/mammouth
      contentFile: ./context.md

  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command: bash /home/agent/.local/bin/mammouth-startup-ca.sh
          user: "0"
          env: [PROXY_CA_CERT_B64, JAVA_HOME]
          description: Import the sandbox proxy CA into the JDK cacerts (Maven trust)
        - command: bash /home/agent/.local/bin/mammouth-startup-maven.sh
          user: "1000"
          env: [GITHUB_MAVEN_TOKEN, HOME]
          description: Write ~/.m2/settings.xml with proxy routing, github-maven and host-cache profile
