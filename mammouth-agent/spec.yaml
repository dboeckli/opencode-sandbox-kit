schemaVersion: "2"
kind: sandbox
name: mammouth
displayName: "Mammouth Code (OpenCode-Fork)"
description: "Mammouth Code Agent mit Context7, IntelliJ MCP, JDK, Maven, Docker CLI und kubectl"

sandbox:
  image: "docker/sandbox-templates:opencode-docker"
  entrypoint: [mammouth]

agentInstructions:
  filename: AGENTS.md
  content: |
    ## Sandbox environment

    You are running inside a Docker sandbox. The workspace is mounted at its
    absolute host path. `sudo` is passwordless; use it for package installs.
    Docker is available inside the sandbox; containers you start are isolated
    in the microVM. The IntelliJ MCP server runs on the Windows host and is
    reached via `host.docker.internal:64342`.

permissions:
  network:
    allow:
      # OpenCode
      - "opencode.ai:443"
      - "*.opencode.ai:443"
      # Context7
      - "context7.com:443"
      - "*.context7.com:443"
      # Mammouth AI
      - "mammouth.ai:443"
      - "*.mammouth.ai:443"
      - "code.mammouth.ai:443"
      - "model-explorer.mammouth.ai:443"
      # GitHub
      - "api.github.com:443"
      - "github.com:443"
      - "*.github.com:443"
      - "objects.githubusercontent.com:443"
      - "githubusercontent.com:443"
      - "*.githubusercontent.com:443"
      - "models.dev:443"
      - "registry.npmjs.org:443"
      - "dlcdn.apache.org:443"
      # Apache Camel (Doku, Dependencies)
      - "camel.apache.org:443"
      - "*.camel.apache.org:443"
      # IntelliJ IDEA MCP Server (Windows Host via Docker Desktop DNS)
      - "localhost:64342"
      - "127.0.0.1:64342"
      - "host.docker.internal:64342"
      # Docker Desktop Kubernetes (kube-apiserver, Host via Docker Desktop DNS)
      - "localhost:6443"
      - "127.0.0.1:6443"
      - "host.docker.internal:6443"
      # Maven Central
      - "repo1.maven.org:443"
      - "maven.org:443"
      - "*.maven.org:443"
      # Spring
      - "repo.spring.io:443"
      - "spring.io:443"
      - "*.spring.io:443"
      - "start.spring.io:443"
      # Docker
      - "docker.io:443"
      - "*.docker.io:443"
      - "docker.com:443"
      - "*.docker.com:443"
      - "download.docker.com:443"
      - "dl.k8s.io:443"
      - "get.helm.sh:443"
      # Zusätzliche Container-Registries (Observability / GitHub Packages)
      - "docker.elastic.co:443"
      - "cr.jaegertracing.io:443"
      - "ghcr.io:443"
      # Private Maven- & Helm-Repositories
      - "repo.repsy.io:443"
      - "jitpack.io:443"
      - "artifacts.cibseven.org:443"
      - "packages.scm-manager.org:443"
      # Cloudsmith (Artifact-Hosting API)
      - "api.cloudsmith.io:443"
      # Liberica JDK (Renovate Versions-API)
      - "api.bell-sw.com:443"
      # Ubuntu apt (http, Port 80; archive.ubuntu.com for amd64, ports.ubuntu.com for arm64)
      - "archive.ubuntu.com"
      - "security.ubuntu.com"
      - "ports.ubuntu.com"
      # MongoDB apt (Helm-Test-Pod)
      - "repo.mongodb.org"
      # Python / PyPI
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      # Skills CLI (install via add-skill.vercel.sh)
      - "add-skill.vercel.sh:443"
      # Web search (last resort, allow-list for websearch/webfetch provider)
      - "*.exa.ai:443"
      # Stack Overflow API (Fallback-Quelle bei spezifischen Fehlermeldungen)
      - "api.stackexchange.com:443"

credentials:
  - service: mammouth
    description: "Mammouth Code API-Key (https://mammouth.ai/app/account/settings/api)"
    apiKey:
      name: MAMMOUTH_API_KEY
      proxyManaged: true
      inject:
        - domain: api.mammouth.ai
          header: Authorization
          format: "Bearer %s"
  - service: context7
    description: "Context7 API-Key (https://context7.com/dashboard)"
    apiKey:
      name: CONTEXT7_API_KEY
      proxyManaged: true
      inject:
        - domain: context7.com
          header: Authorization
          format: "Bearer %s"
  - service: stackoverflow
    description: "Stack Overflow API-Key (https://stackapps.com/applications)"
    apiKey:
      name: STACKOVERFLOW_API_KEY
      proxyManaged: true
      inject:
        - domain: api.stackexchange.com
          header: Authorization
          format: "Bearer %s"
  - service: cloudsmith
    description: "Cloudsmith API-Key (https://cloudsmith.io/user/settings/api-keys/)"
    apiKey:
      name: CLOUDSMITH_API_KEY
      proxyManaged: true
      inject:
        - domain: api.cloudsmith.io
          header: X-Api-Key
          format: "%s"

setup:
  install:
    - command: "bash /home/agent/.local/bin/install-tooling.sh"
      description: Install shared tooling as root (npm/apt/shfmt/JDK/Maven/Docker/Compose/kubectl/Helm) — source files/home/.local/bin/install-tooling.sh
    - command: "bash /home/agent/.local/bin/install-tooling-user.sh"
      user: "1000"
      description: Install agent-user tooling (skills + Claude statusline) — source files/home/.local/bin/install-tooling-user.sh
    - command: |
        curl -fsSL https://code.mammouth.ai/install.sh | bash
      user: "1000"
      description: Install Mammouth Code (binaries land in ~/.mammouth)
    - command: "ln -sf /home/agent/.mammouth/bin/mammouth /usr/local/bin/mammouth"
      description: Symlink mammouth into PATH for entrypoint
  startup:
    - command:
        - python3
        - /home/agent/.local/bin/regenerate-kubeconfig.py
      user: "1000"
      description: Regenerate ~/.kube/config from the read-only host kubeconfig mount (Docker Desktop Kubernetes) — idempotent, no-op without mount

environment:
  variables:
    JAVA_HOME: "/usr/local/java"