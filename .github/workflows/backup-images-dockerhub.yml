name: Backup images to Docker Hub

# Manueller (workflow_dispatch) Build/Publish der Kit-Images nach Docker Hub.
# Dient als Backup/Mirror, wenn die Cloudsmith-Quote (HTTP 402) klemmt. Kein
# Cloudsmith-Zugriff: gebaut wird aus den Docker-Hub-Basis-Images
# (`docker/sandbox-templates:*`) + den Kit-Dockerfiles.
#
# Auswahl beim Start:
#   - image: opencode | claude | mammouth | mistral-vibe | all
#   - arch:  amd64 | arm64 | both   (both = native Runner + imagetools-Merge)
#   - push:  true/false (Build-only)
#   - tag:   Override; Default = Basis-Pin (TEMPLATE_VERSION) bzw. VIBE_VERSION
#
# Native Runner je Architektur:
#   amd64 -> ubuntu-latest   |   arm64 -> ubuntu-24.04-arm
#   (arm64 NICHT per QEMU: `uv tool install` für mistral-vibe scheitert unter QEMU.)
#
# Credentials: repo-Variable DOCKER_USERNAME (Docker-Hub-Namespace/-User) +
# repo-Secret DOCKER_PAT (Docker-Hub-PAT; identisch zum e2e-`sbx login`).

run-name: >
  ${{ github.workflow }}: ${{ inputs.image }} / ${{ inputs.arch }} (push=${{ inputs.push }})

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Kit / Image"
        type: choice
        options: [opencode, claude, mammouth, mistral-vibe, all]
        default: opencode
      arch:
        description: "Architektur"
        type: choice
        options: [amd64, arm64, both]
        default: both
      push:
        description: "Nach Docker Hub pushen"
        type: boolean
        default: true
      tag:
        description: "Image-Tag (leer = Basis-Pin / VIBE_VERSION)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.m.outputs.build_matrix }}
      merge_matrix: ${{ steps.m.outputs.merge_matrix }}
      both: ${{ steps.m.outputs.both }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute build/merge matrix
        id: m
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          ARCH: ${{ inputs.arch }}
          TAG_OVERRIDE: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          images="$IMAGE"
          [ "$images" = "all" ] && images="opencode claude mammouth mistral-vibe"

          both="false"; archs="$ARCH"
          if [ "$archs" = "both" ]; then archs="amd64 arm64"; both="true"; fi

          build='[]'; merge='[]'
          for img in $images; do
            case "$img" in
              opencode)
                ctx=opencode-agent;     df=opencode-agent/opencode/Dockerfile
                name=sbx-opencode-tooling
                pin=$(grep -oE 'opencode-docker-[0-9]+(\.[0-9]+)+' "$df" | head -1 | grep -oE '[0-9]+(\.[0-9]+)+$');;
              claude)
                ctx=opencode-agent;     df=opencode-agent/claude/Dockerfile
                name=sbx-claude-tooling
                pin=$(grep -oE 'claude-code-docker-[0-9]+(\.[0-9]+)+' "$df" | head -1 | grep -oE '[0-9]+(\.[0-9]+)+$');;
              mammouth)
                ctx=mammouth-agent;     df=mammouth-agent/Dockerfile
                name=sbx-mammouth
                pin=$(grep -oE 'opencode-docker-[0-9]+(\.[0-9]+)+' "$df" | head -1 | grep -oE '[0-9]+(\.[0-9]+)+$');;
              mistral-vibe)
                ctx=mistral-vibe-agent; df=mistral-vibe-agent/Dockerfile
                name=sbx-mistral-vibe
                pin=$(grep -oE 'VIBE_VERSION=[0-9]+(\.[0-9]+)+' "$df" | head -1 | cut -d= -f2);;
              *)
                echo "unknown image: $img" >&2; exit 1;;
            esac

            tag="$TAG_OVERRIDE"; [ -n "$tag" ] || tag="$pin"

            for a in $archs; do
              if [ "$a" = "amd64" ]; then runner=ubuntu-latest; suffix=-amd64
              else                          runner=ubuntu-24.04-arm; suffix=-arm64; fi
              build=$(jq -c \
                --arg image "$img" --arg name "$name" --arg context "$ctx" --arg dockerfile "$df" \
                --arg arch "$a" --arg runner "$runner" --arg suffix "$suffix" --arg tag "$tag" \
                '. + [{image:$image, name:$name, context:$context, dockerfile:$dockerfile, arch:$arch, runner:$runner, suffix:$suffix, tag:$tag}]' \
                <<<"$build")
            done

            merge=$(jq -c --arg name "$name" --arg tag "$tag" '. + [{name:$name, tag:$tag}]' <<<"$merge")
          done

          {
            echo "build_matrix=$build"
            echo "merge_matrix=$merge"
            echo "both=$both"
          } >> "$GITHUB_OUTPUT"

          echo "build matrix: $build"
          echo "merge matrix: $merge"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build & push ${{ matrix.name }}${{ matrix.suffix }} (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: ${{ inputs.push }}
          provenance: true
          sbom: true
          tags: ${{ vars.DOCKER_USERNAME }}/${{ matrix.name }}${{ matrix.suffix }}:${{ matrix.tag }}

  merge:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.both == 'true' && inputs.push }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.merge_matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Merge multi-arch ${{ matrix.name }}:${{ matrix.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ns="${{ vars.DOCKER_USERNAME }}"
          docker buildx imagetools create \
            -t "$ns/${{ matrix.name }}:${{ matrix.tag }}" \
            "$ns/${{ matrix.name }}-amd64:${{ matrix.tag }}" \
            "$ns/${{ matrix.name }}-arm64:${{ matrix.tag }}"
