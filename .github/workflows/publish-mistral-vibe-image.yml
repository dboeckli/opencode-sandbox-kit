name: Publish Mistral Vibe image

# Builds and publishes the pinned `domboeckli/sbx-mistral-vibe` image that the
# `mistral-vibe-agent` sandbox kit references (spec.yaml `sandbox.image`, via the
# `imageTag` kit arg).
#
# The image bakes a pinned Mistral Vibe version on top of the versioned
# `shell-docker` sandbox template (Docker Engine inside the sandbox), following
# https://docs.docker.com/guides/mistral-vibe-sandbox/.
# Vibe is not a pre-built docker/sandbox-templates agent, so the kit ships its
# own image instead of installing the agent at sandbox build time.
#
# This workflow is both directly dispatchable and a reusable workflow
# (`workflow_call`). The `e2e.yml` workflow calls it before the scenario matrix,
# so the image exists for the `mistral-vibe` e2e scenario on every push/PR/nightly
# run. Manual runs use `workflow_dispatch`.
#
# Tags (the image tag must stay a valid Docker tag, so the timestamp is a semver
# prerelease identifier, not build metadata — `+` is not allowed in a tag):
#   - master / main: `<VIBE_VERSION>` (release tag)
#   - feature/PR:    `<VIBE_VERSION>-<branch-slug>.<YYYYMMDDHHMMSS>` (semver
#                    prerelease) plus the moving tag `<branch-slug>`
#
# The image is built for linux/amd64 only: the `uv tool install` step does not
# run under QEMU arm64 emulation (buildx exit code 1). arm64 would need a native
# `ubuntu-24.04-arm` runner plus a `docker buildx imagetools create` merge.

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to Docker Hub (off = build only)"
        type: boolean
        default: true
  workflow_call:
    inputs:
      push:
        description: "Push the image to Docker Hub (off = build only)"
        type: boolean
        default: true
    outputs:
      version_tag:
        description: "Image version tag that was built/pushed"
        value: ${{ jobs.build.outputs.version_tag }}

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: domboeckli
  IMAGE_NAME: sbx-mistral-vibe

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.tags.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tags from the Vibe pin and the branch
        id: tags
        run: |
          set -euo pipefail
          pin=$(grep -oE 'ARG VIBE_VERSION=[0-9]+(\.[0-9]+)+' mistral-vibe-agent/Dockerfile \
            | head -1 | cut -d= -f2)
          if [ -z "$pin" ]; then
            echo "VIBE_VERSION pin not found in mistral-vibe-agent/Dockerfile" >&2
            exit 1
          fi
          spec_default=$(grep -oE 'default: "[0-9]+(\.[0-9]+)+"' mistral-vibe-agent/spec.yaml \
            | head -1 | grep -oE '[0-9]+(\.[0-9]+)+')
          if [ "$spec_default" != "$pin" ]; then
            echo "spec.yaml args.imageTag.default ($spec_default) != Dockerfile pin ($pin)" >&2
            exit 1
          fi
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ "$ref" = "master" ] || [ "$ref" = "main" ]; then
            version_tag="$pin"
            extra_tag=""
          else
            slug=$(printf '%s' "$ref" | tr '[:upper:]' '[:lower:]' \
              | sed -E 's#[^a-z0-9_.-]+#-#g; s#^-+##; s#-+$##')
            ts=$(date -u +%Y%m%d%H%M%S)
            version_tag="${pin}-${slug}.${ts}"
            extra_tag="$slug"
          fi
          {
            echo "version_tag=$version_tag"
            echo "tags<<EOF"
            echo "${IMAGE_NAMESPACE}/${IMAGE_NAME}:${version_tag}"
            if [ -n "$extra_tag" ]; then echo "${IMAGE_NAMESPACE}/${IMAGE_NAME}:${extra_tag}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "version_tag=$version_tag extra_tag=${extra_tag:-<none>}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push (amd64, provenance/SBOM)
        uses: docker/build-push-action@v6
        with:
          context: mistral-vibe-agent
          platforms: linux/amd64
          provenance: true
          sbom: true
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
