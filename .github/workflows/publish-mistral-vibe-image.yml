name: Publish Mistral Vibe image

# Builds and publishes the pinned `domboeckli/sbx-mistral-vibe` image that the
# `mistral-vibe-agent` sandbox kit references (spec.yaml `sandbox.image`).
#
# The image bakes a pinned Mistral Vibe version on top of the versioned
# `shell-docker` sandbox template (Docker Engine inside the sandbox), following
# https://docs.docker.com/guides/mistral-vibe-sandbox/.
# Vibe is not a pre-built docker/sandbox-templates agent, so the kit ships its
# own image instead of installing the agent at sandbox build time.
#
# This workflow is both directly dispatchable and a reusable workflow
# (`workflow_call`). The `e2e.yml` workflow calls it before the scenario matrix,
# so the image exists for the `mistral-vibe` e2e scenario on every push/PR/nightly
# run. Manual runs use `workflow_dispatch`.
#
# The image is built for linux/amd64 only: the `uv tool install` step does not
# run under QEMU arm64 emulation (buildx exit code 1). arm64 would need a native
# `ubuntu-24.04-arm` runner plus a `docker buildx imagetools create` merge.
#
# The tag is the Vibe version from mistral-vibe-agent/Dockerfile (ARG
# VIBE_VERSION) — a real version, not a moving tag. Renovate tracks the pin.
# This workflow pushes only the version tag; a local bootstrap build
# additionally tags `domboeckli/sbx-mistral-vibe:local` (see README).

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to Docker Hub (off = build only)"
        type: boolean
        default: true
  workflow_call:
    inputs:
      push:
        description: "Push the image to Docker Hub (off = build only)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: domboeckli
  IMAGE_NAME: sbx-mistral-vibe

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Vibe version pin from Dockerfile
        id: version
        run: |
          set -euo pipefail
          version=$(grep -oE 'ARG VIBE_VERSION=[0-9]+(\.[0-9]+)+' mistral-vibe-agent/Dockerfile \
            | head -1 | cut -d= -f2)
          if [ -z "$version" ]; then
            echo "VIBE_VERSION pin not found in mistral-vibe-agent/Dockerfile" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Vibe version: $version"

      - name: Check spec image tag matches the Dockerfile pin
        run: |
          set -euo pipefail
          image=$(grep -oE 'image: *"?[^"]+' mistral-vibe-agent/spec.yaml | head -1)
          echo "spec image: $image"
          if ! printf '%s' "$image" | grep -q ":${{ steps.version.outputs.value }}$"; then
            echo "spec.yaml sandbox.image tag does not match the Dockerfile pin" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push (amd64, provenance/SBOM)
        # amd64 only: the `uv tool install` step does not run under QEMU arm64
        # emulation. arm64 can be added later via a native `ubuntu-24.04-arm`
        # runner + `docker buildx imagetools create` manifest merge.
        uses: docker/build-push-action@v6
        with:
          context: mistral-vibe-agent
          platforms: linux/amd64
          provenance: true
          sbom: true
          push: ${{ inputs.push }}
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
