name: Kit e2e

# End-to-end test: install a real `sbx` CLI, sign in to Docker via `sbx login`
# (repo variable DOCKER_USERNAME / secret DOCKER_PAT — sbx needs a Docker account
# session), store the Cloudsmith registry credential
# (variables CLOUDSMITH_USERNAME/CLOUDSMITH_NAMESPACE/CLOUDSMITH_REPO + secret CLOUDSMITH_API_KEY),
# register fake API-key secrets for github/github-maven/anthropic/mammouth/mistral/context7/openrouter/google,
# and run the 4 agent scenarios (OpenCode / Claude / Mammouth / Mistral Vibe)
# from local-test/local-test-kits.py with `--ci` (no real
# mammouth/mistral/context7 API calls — fake keys only prove proxy wiring).
#
# The 4 scenarios run as PARALLEL matrix jobs (`e2e-scenario`, one job per scenario),
# each on its own runner with the full setup (sbx, secrets, Cloudsmith registry credential).
# Modeled on docker/sbx-kits-contrib/.github/workflows/e2e.yml, adapted to
# this repo: no Go TCK, the Python scenario runner instead.
#
# The images are served from Cloudsmith (`docker.cloudsmith.io/dboeckli/sbx/…`):
# the `mistral-vibe` scenario pulls `sbx-mistral-vibe`; `opencode`/`claude` pull
# `sbx-opencode-tooling`/`sbx-claude-tooling`, and `mammouth` pulls `sbx-mammouth`
# (baked tooling/agent, issue #137). The `build-and-publish-*-image` jobs (reusing the
# standalone build-and-publish workflows) build those images — but they PUSH only on
# `push` to master / `schedule`; on PR/feature-branch builds they are build-only
# (`push: false`), and the scenarios then use the published master `latest` tag.
# A final `cleanup` job removes obsolete feature images right after the build.

on:
  push:
  pull_request:
  schedule:
    # Nightly at 03:05 UTC, after validate.yml (03:00) has finished.
    - cron: "5 3 * * *"

permissions:
  contents: read

jobs:
  build-and-publish-mistral-vibe-image:
    # Build (and, unless it's a PR, push) the Mistral Vibe image the
    # `mistral-vibe` scenario pulls. Reuses the standalone build-and-publish workflow
    # so the image always matches the branch under test (multi-arch).
    # Same fork-PR guard as the scenario job: fork PRs have no Docker Hub secrets.
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/build-and-publish-mistral-vibe-image.yml
    with:
      push: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    secrets: inherit

  build-and-publish-opencode-image:
    # Build (and, unless it's a PR, push) the OpenCode tooling image the
    # `opencode` scenario pulls (`--template docker.cloudsmith.io/dboeckli/sbx/sbx-opencode-tooling:<tag>`).
    # Reuses the standalone build-and-publish workflow (multi-arch).
    # Same fork-PR guard as the scenario job: fork PRs have no Docker Hub secrets.
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/build-and-publish-opencode-image.yml
    with:
      push: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    secrets: inherit

  build-and-publish-claude-image:
    # Build (and, unless it's a PR, push) the Claude tooling image the
    # `claude` scenario pulls (`--template docker.cloudsmith.io/dboeckli/sbx/sbx-claude-tooling:<tag>`).
    # Reuses the standalone build-and-publish workflow (multi-arch).
    # Same fork-PR guard as the scenario job: fork PRs have no Docker Hub secrets.
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/build-and-publish-claude-image.yml
    with:
      push: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    secrets: inherit

  build-and-publish-mammouth-image:
    # Build (and, unless it's a PR, push) the Mammouth image the `mammouth` scenario pulls
    # (`--kit-arg imageTag=<tag>`). Reuses the standalone build-and-publish workflow (multi-arch).
    # Same fork-PR guard as the scenario job: fork PRs have no Docker Hub secrets.
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/build-and-publish-mammouth-image.yml
    with:
      push: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    secrets: inherit

  image-cache:
    # Hält die Tooling-/Agent-Images als tar.gz im GitHub Container Registry (GHCR) vor.
    # Reiner Pull-Cache, keyed by Cloudsmith-Digest: Cloudsmith bleibt Build-/Publish-Heimat.
    # Zweck: die Cloudsmith-Bandwidth-Entitlement schonen (e2e zieht sonst bei jedem Lauf
    # 4 Multi-Arch-Images). Fork-PRs: keine Secrets -> ausgenommen.
    needs: [build-and-publish-mistral-vibe-image, build-and-publish-opencode-image, build-and-publish-claude-image, build-and-publish-mammouth-image]
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: opencode,     image: sbx-opencode-tooling, tag: "${{ needs.build-and-publish-opencode-image.outputs.version_tag }}" }
          - { scenario: claude,       image: sbx-claude-tooling,   tag: "${{ needs.build-and-publish-claude-image.outputs.version_tag }}" }
          - { scenario: mammouth,     image: sbx-mammouth,         tag: "${{ needs.build-and-publish-mammouth-image.outputs.version_tag }}" }
          - { scenario: mistral-vibe, image: sbx-mistral-vibe,     tag: "${{ needs.build-and-publish-mistral-vibe-image.outputs.version_tag }}" }
    env:
      CLOUDSMITH_REGISTRY: docker.cloudsmith.io
      CLOUDSMITH_NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
      CLOUDSMITH_REPO: ${{ vars.CLOUDSMITH_REPO }}
    steps:
      - name: Resolve tag (release tag on master/schedule, else latest)
        id: t
        run: |
          set -euo pipefail
          if { [ "${GITHUB_EVENT_NAME}" = "schedule" ] || { [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/master" ]; }; } && [ -n "${{ matrix.tag }}" ]; then
            echo "tag=${{ matrix.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up ORAS
        uses: oras-project/setup-oras@v1
      - name: Ensure GHCR cache (pull from Cloudsmith on miss only)
        env:
          CLOUDSMITH_USERNAME: ${{ vars.CLOUDSMITH_USERNAME }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC="${CLOUDSMITH_REGISTRY}/${CLOUDSMITH_NAMESPACE:-dboeckli}/${CLOUDSMITH_REPO:-sbx}/${{ matrix.image }}:${{ steps.t.outputs.tag }}"
          echo "$GITHUB_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          DIGEST=$(oras manifest fetch --descriptor "$SRC" | jq -r .digest)
          CACHE="ghcr.io/${{ github.repository_owner }}/sbx-cache-${{ matrix.scenario }}:${DIGEST/:/-}"
          if oras manifest fetch "$CACHE" >/dev/null 2>&1; then
            echo "GHCR cache hit: $CACHE"; exit 0
          fi
          echo "$CLOUDSMITH_API_KEY" | docker login docker.cloudsmith.io -u "$CLOUDSMITH_USERNAME" --password-stdin
          docker pull "$SRC"
          docker save "$SRC" -o image.tar
          gzip -f image.tar
          oras push "$CACHE" image.tar.gz:application/gzip

  e2e-scenario:
    # Scheduled runs (nightly cron) and push must run; fork PRs do not expose
    # Docker Hub secrets, so skip those.
    needs: [build-and-publish-mistral-vibe-image, build-and-publish-opencode-image, build-and-publish-claude-image, build-and-publish-mammouth-image, image-cache]
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    name: e2e (${{ matrix.scenario }})
    strategy:
      # Jedes Szenario ist unabhaengig: ein Fehlschlag bricht die uebrigen
      # parallelen Jobs nicht ab (ersetzt das fruehere `success() || failure()`).
      fail-fast: false
      matrix:
        scenario: [opencode, claude, mammouth, mistral-vibe]
    env:
      # Sandbox-Template-Version (gepinnt) — muss mit validate.yml identisch sein; Basis der
      # Tooling-Images (opencode-agent/{opencode,claude}/Dockerfile ARG BASE_IMAGE) und des
      # Mammouth-spec-Images. Updates via Renovate (customManager docker/sandbox-templates).
      TEMPLATE_VERSION: 0.7.0
      CLOUDSMITH_REGISTRY: docker.cloudsmith.io
      CLOUDSMITH_NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
      CLOUDSMITH_REPO: ${{ vars.CLOUDSMITH_REPO }}
      # Images werden nur bei push auf master / schedule gepusht; bei PR/Branch-Builds
      # (push: false) nutzt e2e das veröffentlichte `latest`-Master-Image.
      OPENCODE_IMAGE_TAG: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && needs.build-and-publish-opencode-image.outputs.version_tag || 'latest' }}
      CLAUDE_IMAGE_TAG: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && needs.build-and-publish-claude-image.outputs.version_tag || 'latest' }}
      MAMMOUTH_IMAGE_TAG: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && needs.build-and-publish-mammouth-image.outputs.version_tag || 'latest' }}
      VIBE_IMAGE_TAG: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && needs.build-and-publish-mistral-vibe-image.outputs.version_tag || 'latest' }}
      # Image wurde vom image-cache-Job vorab geladen (sbx template load) → kein Registry-Pull.
      SBX_PULL: never
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM access
        run: |
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Download sbx (pinned version)
        # sbx-Version ist gepinnt (SBX_VERSION), Updates via Renovate
        # (customManager docker/sbx-releases in .github/renovate.json).
        env:
          SBX_VERSION: v0.45.1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "using sbx ${SBX_VERSION}"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://github.com/docker/sbx-releases/releases/download/${SBX_VERSION}/DockerSandboxes-linux.tar.gz" \
            -o /tmp/DockerSandboxes-linux.tar.gz
          tar xzf /tmp/DockerSandboxes-linux.tar.gz -C /tmp

      - name: Install sbx
        run: |
          set -euo pipefail
          sudo PREFIX="${HOME}/.docker/sbx" /tmp/docker-sbx/install.sh
          echo "${HOME}/.docker/sbx/bin" >> "$GITHUB_PATH"

      - name: Verify sbx installation
        run: sbx version

      - name: Set up Secret Service for the sbx secret store
        # sbx's Linux binary persists credentials/secrets via libsecret, which talks
        # to org.freedesktop.secrets over D-Bus. GHA's ubuntu-latest is
        # headless, so no Secret Service is running and `sbx secret set` / `sbx login` block.
        # This mirrors the recipe from docker/sbx-kits-contrib e2e.yml (and
        # its root reference in docker/secrets-engine scripts/gnome-keyring):
        #
        #   1. Install gnome-keyring + dbus-daemon.
        #   2. Pre-create ~/.local/share/keyrings/login.keyring as a
        #      passwordless ini stanza so `gnome-keyring-daemon --start`
        #      adopts it instead of prompting via gcr-prompter.
        #   3. Start a session bus (dbus-daemon, not dbus-launch).
        #   4. Start gnome-keyring-daemon's secrets component.
        #   5. Poll until org.freedesktop.secrets is owned on D-Bus.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus

          mkdir -p "$HOME/.local/share/keyrings"
          cat > "$HOME/.local/share/keyrings/login.keyring" <<'KEYRING'
          [keyring]
          display-name=login
          ctime=1750965549
          mtime=0
          lock-on-idle=false
          lock-after=false
          KEYRING

          DBUS_SESSION_BUS_ADDRESS=$(dbus-daemon --session --print-address --fork)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          export DBUS_SESSION_BUS_ADDRESS

          gnome-keyring-daemon --start --components=secrets >/dev/null

          for _ in $(seq 1 50); do
            if gdbus call --session \
                --dest org.freedesktop.DBus \
                --object-path /org/freedesktop/DBus \
                --method org.freedesktop.DBus.GetNameOwner \
                org.freedesktop.secrets >/dev/null 2>&1; then
              echo "Secret Service registered on D-Bus"
              exit 0
            fi
            sleep 0.1
          done
          echo "Timed out waiting for org.freedesktop.secrets to register"
          exit 1

      - name: Sign in to Docker via sbx
        # sbx requires a Docker account session to create/manage sandboxes
        # ("user is not authenticated to Docker") — independent of which registry
        # the images come from. Separate from the Cloudsmith registry credential below.
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_USERNAME}" ] || [ -z "${DOCKER_PAT}" ]; then
            echo "DOCKER_USERNAME / DOCKER_PAT not configured; cannot run e2e."
            exit 1
          fi
          USER_CLEAN=$(printf '%s' "$DOCKER_USERNAME" | tr -d '[:space:]')
          TOKEN_CLEAN=$(printf '%s' "$DOCKER_PAT"    | tr -d '[:space:]')
          printf '%s' "$TOKEN_CLEAN" | sbx login --username "$USER_CLEAN" --password-stdin

      - name: Store Cloudsmith registry credential (authenticated image pulls)
        # The sandbox pulls the tooling/agent image from Cloudsmith (public repo, so
        # anonymous pull works; an explicit host-only registry credential is preferred).
        # Docker Hub is no longer involved for these images (only as the base-image
        # upstream at build time). Docs: REGISTRY SECRETS can't combine with --token/--oauth/--ref.
        env:
          CLOUDSMITH_USERNAME: ${{ vars.CLOUDSMITH_USERNAME }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDSMITH_USERNAME}" ] || [ -z "${CLOUDSMITH_API_KEY}" ]; then
            echo "CLOUDSMITH_USERNAME / CLOUDSMITH_API_KEY not configured; cannot run e2e."
            exit 1
          fi
          # Defensive trim: GH preserves any whitespace pasted into the secret editor.
          USER_CLEAN=$(printf '%s' "$CLOUDSMITH_USERNAME" | tr -d '[:space:]')
          TOKEN_CLEAN=$(printf '%s' "$CLOUDSMITH_API_KEY"  | tr -d '[:space:]')
          printf '%s' "$TOKEN_CLEAN" | sbx secret set --registry docker.cloudsmith.io \
            --username "$USER_CLEAN" --password-stdin

      - name: Register sandbox secrets (github real, github-maven/anthropic/mammouth/mistral/zai/context7/openrouter/google fake)
        # local-test/local-test-kits.py asserts these global services exist
        # (`sbx secret ls`). github uses the Actions GITHUB_TOKEN so
        # `gh auth status` passes inside the sandbox; github-maven, anthropic,
        # mammouth, mistral, zai, context7, openrouter and google get fake keys — enough to prove the
        # kit's proxy env wiring.
        # `-g` was removed in sbx v0.38 (secrets are global by default);
        # `-f` overwrites an existing entry.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | sbx secret set github
          printf '%s' 'ghp-fake-ci-key' | sbx secret set github-maven -f
          printf '%s' 'sk-ant-fake-ci-key' | sbx secret set anthropic -f
          printf '%s' 'mammouth-fake-ci-key' | sbx secret set mammouth -f
          printf '%s' 'mistral-fake-ci-key' | sbx secret set mistral -f
          printf '%s' 'zai-fake-ci-key' | sbx secret set zai -f
          printf '%s' 'ctx7op-fake-ci-key' | sbx secret set context7 -f
          printf '%s' 'openrouter-fake-ci-key' | sbx secret set openrouter -f
          printf '%s' 'google-fake-ci-key' | sbx secret set google -f
          printf '%s' 'stackoverflow-fake-ci-key' | sbx secret set stackoverflow -f
          printf '%s' 'cloudsmith-fake-ci-key' | sbx secret set cloudsmith -f
          printf '%s' 'sonar-fake-ci-key' | sbx secret set sonarcloud -f
          printf '%s' 'codeberg-fake-ci-key' | sbx secret set codeberg -f

      - name: Pre-create credential bindings (third-party v2 kit)
        # Third-party schemaVersion:"2" kits require an approved credential
        # binding per declared service (apiKey + domains). On a fresh runner
        # nothing has been approved interactively, so write the file first —
        # otherwise the sandbox starts with the credentials withheld.
        run: |
          mkdir -p "$HOME/.config/sbx"
          cat > "$HOME/.config/sbx/credentials.yaml" <<'EOF'
          bindings:
            context7:
              apiKey:
                domains: [context7.com]
            deepseek:
              apiKey:
                domains: [api.deepseek.com]
            mammouth:
              apiKey:
                domains: [api.mammouth.ai]
            mistral:
              apiKey:
                domains: [api.mistral.ai]
            zai:
              apiKey:
                domains: [api.z.ai]
            stackoverflow:
              apiKey:
                domains: [api.stackexchange.com]
            cloudsmith:
              apiKey:
                domains: [api.cloudsmith.io, upload.cloudsmith.io]
            sonarcloud:
              apiKey:
                domains: [sonarcloud.io]
            codeberg:
              apiKey:
                domains: [codeberg.org]
            github-maven:
              apiKey:
                domains: [maven.pkg.github.com]
          EOF

      - name: Initialize global network policy (balanced)
        # On a fresh runner the global policy is uninitialized, which makes
        # `sbx create` fail. `balanced` = default deny with common dev sites
        # allowed; the Docker docs recommend it for CI pipelines. This is a
        # functional e2e (tools/config/startup), not a strict per-domain
        # contract test, so deny-all would only break install commands that
        # need apt/npm/GitHub reachability not declared in the kit's allow
        # list.
        run: sbx policy init balanced

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Load image from GHCR cache into sbx
        # Cloudsmith bleibt Build-/Publish-Heimat. Das Image wird aus dem GHCR-tar-Cache
        # (keyed by Cloudsmith-Digest, siehe image-cache-Job) geladen und via
        # `sbx template load` in den Runtime-Store gelegt; `SBX_PULL=never` verhindert den Pull.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ matrix.scenario }}" in
            opencode)     IMG=sbx-opencode-tooling; TAG="$OPENCODE_IMAGE_TAG";;
            claude)       IMG=sbx-claude-tooling;   TAG="$CLAUDE_IMAGE_TAG";;
            mammouth)     IMG=sbx-mammouth;         TAG="$MAMMOUTH_IMAGE_TAG";;
            mistral-vibe) IMG=sbx-mistral-vibe;     TAG="$VIBE_IMAGE_TAG";;
          esac
          SRC="${CLOUDSMITH_REGISTRY}/${CLOUDSMITH_NAMESPACE:-dboeckli}/${CLOUDSMITH_REPO:-sbx}/${IMG}:${TAG}"
          echo "$GITHUB_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          DIGEST=$(oras manifest fetch --descriptor "$SRC" | jq -r .digest)
          CACHE="ghcr.io/${{ github.repository_owner }}/sbx-cache-${{ matrix.scenario }}:${DIGEST/:/-}"
          oras pull "$CACHE" -o .
          gunzip -f image.tar.gz
          sbx template load image.tar

      - name: Run e2e tests (${{ matrix.scenario }})
        run: python3 local-test/local-test-kits.py ${{ matrix.scenario }} --ci

      - name: Sign out of Docker Hub
        if: always()
        run: sbx logout --yes || true

      - name: Report status to Codeberg
        # GitHub Actions is the execution host (reliable runners); report the outcome back to the
        # canonical Codeberg commit so Codeberg commits/PRs show the check (Forgejo commit status API).
        # Per-scenario context (`github-actions/e2e-<scenario>`) keeps the matrix checks distinct.
        # Requires repo secret CODEBERG_STATUS_TOKEN (Codeberg PAT, scope `write:repository`).
        if: ${{ always() }}
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_STATUS_TOKEN }}
          STATE: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # For pull_request events github.sha is the synthetic merge commit (absent on Codeberg);
          # use the PR head SHA then, else the pushed commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${CODEBERG_TOKEN}" ]; then
            echo "CODEBERG_STATUS_TOKEN not set - skipping Codeberg status report."
            exit 0
          fi
          state="failure"
          if [ "${STATE}" = "success" ]; then state="success"; fi
          code=$(curl -sS -o /tmp/statusresp -w '%{http_code}' -X POST \
            -H "Authorization: token ${CODEBERG_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://codeberg.org/api/v1/repos/dboeckli/opencode-sandbox-kit/statuses/${SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"github-actions/e2e-${{ matrix.scenario }}\",\"description\":\"GitHub Actions (Kit e2e ${{ matrix.scenario }})\",\"target_url\":\"${TARGET_URL}\"}" || echo "000")
          echo "Codeberg commit status -> HTTP ${code} (${state})"
          case "${code}" in
            2*) ;;
            *) cat /tmp/statusresp 2>/dev/null || true ;;
          esac

  cleanup:
    # Cleanup NACH dem Build/den Szenarien (deterministisch statt reiner `schedule`,
    # da GitHub schedule-Runs stark verzögert). Nur bei push(master)/schedule relevant;
    # läuft auch, wenn die Szenarien fehlschlagen (always), damit Storage frei wird.
    needs: [build-and-publish-mistral-vibe-image, build-and-publish-opencode-image, build-and-publish-claude-image, build-and-publish-mammouth-image, e2e-scenario]
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
    uses: ./.github/workflows/cleanup-cloudsmith.yml
    secrets: inherit
