name: Kit e2e

# End-to-end test: install a real `sbx` CLI, authenticate against Docker Hub
# non-interactively (repo variable DOCKER_USERNAME / secret DOCKER_PAT),
# register fake API-key secrets for github/github-maven/anthropic/mammouth/mistral/context7/openrouter/google,
# and run the 4 agent scenarios (OpenCode / Claude / Mammouth / Mistral Vibe)
# from local-test/local-test-kits.py with `--ci` (no real
# mammouth/mistral/context7 API calls — fake keys only prove proxy wiring).
#
# The 4 scenarios run as PARALLEL matrix jobs (`e2e-scenario`, one job per scenario),
# each on its own runner with the full setup (sbx, secrets, Docker Hub login).
# Modeled on docker/sbx-kits-contrib/.github/workflows/e2e.yml, adapted to
# this repo: no Go TCK, the Python scenario runner instead.
#
# The `mistral-vibe` scenario pulls the `domboeckli/sbx-mistral-vibe` image; the
# `opencode` / `claude` scenarios pull `domboeckli/sbx-opencode-tooling` /
# `domboeckli/sbx-claude-tooling`, and `mammouth` pulls `domboeckli/sbx-mammouth`
# (baked tooling/agent, issue #137). The `build-and-publish-*-image` jobs (reusing the
# standalone build-and-publish workflows) build and, for non-PR runs, push those
# images (multi-arch) before the scenario matrix starts.

on:
  push:
  pull_request:
  schedule:
    # Nightly at 03:05 UTC, after validate.yml (03:00) has finished.
    - cron: "5 3 * * *"

permissions:
  contents: read

jobs:
  build-and-publish-mistral-vibe-image:
    # Build (and, unless it's a PR, push) the Mistral Vibe image the
    # `mistral-vibe` scenario pulls. Reuses the standalone build-and-publish workflow
    # so the image always matches the branch under test (multi-arch).
    # Same fork-PR guard as the scenario job: fork PRs have no Docker Hub secrets.
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/build-and-publish-mistral-vibe-image.yml
    with:
      # Always push here: the scenario job only runs for push/schedule/same-repo
      # PRs, and the mistral-vibe scenario must pull this exact branch build.
      push: true
    secrets: inherit

  build-and-publish-opencode-image:
    # Build (and, unless it's a PR, push) the OpenCode tooling image the
    # `opencode` scenario pulls (`--template docker.io/domboeckli/sbx-opencode-tooling:<tag>`).
    # Reuses the standalone build-and-publish workflow (multi-arch).
    # Same fork-PR guard as the scenario job: fork PRs have no Docker Hub secrets.
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/build-and-publish-opencode-image.yml
    with:
      push: true
    secrets: inherit

  build-and-publish-claude-image:
    # Build (and, unless it's a PR, push) the Claude tooling image the
    # `claude` scenario pulls (`--template docker.io/domboeckli/sbx-claude-tooling:<tag>`).
    # Reuses the standalone build-and-publish workflow (multi-arch).
    # Same fork-PR guard as the scenario job: fork PRs have no Docker Hub secrets.
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/build-and-publish-claude-image.yml
    with:
      push: true
    secrets: inherit

  build-and-publish-mammouth-image:
    # Build (and, unless it's a PR, push) the Mammouth image the `mammouth` scenario pulls
    # (`--kit-arg imageTag=<tag>`). Reuses the standalone build-and-publish workflow (multi-arch).
    # Same fork-PR guard as the scenario job: fork PRs have no Docker Hub secrets.
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/build-and-publish-mammouth-image.yml
    with:
      push: true
    secrets: inherit

  e2e-scenario:
    # Scheduled runs (nightly cron) and push must run; fork PRs do not expose
    # Docker Hub secrets, so skip those.
    needs: [build-and-publish-mistral-vibe-image, build-and-publish-opencode-image, build-and-publish-claude-image, build-and-publish-mammouth-image]
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    name: e2e (${{ matrix.scenario }})
    strategy:
      # Jedes Szenario ist unabhaengig: ein Fehlschlag bricht die uebrigen
      # parallelen Jobs nicht ab (ersetzt das fruehere `success() || failure()`).
      fail-fast: false
      matrix:
        scenario: [opencode, claude, mammouth, mistral-vibe]
    env:
      # Sandbox-Template-Version (gepinnt) — muss mit validate.yml identisch sein; Basis der
      # Tooling-Images (opencode-agent/{opencode,claude}/Dockerfile ARG BASE_IMAGE) und des
      # Mammouth-spec-Images. Updates via Renovate (customManager docker/sandbox-templates).
      TEMPLATE_VERSION: 0.7.0
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM access
        run: |
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Download sbx (pinned version)
        # sbx-Version ist gepinnt (SBX_VERSION), Updates via Renovate
        # (customManager docker/sbx-releases in .github/renovate.json).
        env:
          SBX_VERSION: v0.45.1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "using sbx ${SBX_VERSION}"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://github.com/docker/sbx-releases/releases/download/${SBX_VERSION}/DockerSandboxes-linux.tar.gz" \
            -o /tmp/DockerSandboxes-linux.tar.gz
          tar xzf /tmp/DockerSandboxes-linux.tar.gz -C /tmp

      - name: Install sbx
        run: |
          set -euo pipefail
          sudo PREFIX="${HOME}/.docker/sbx" /tmp/docker-sbx/install.sh
          echo "${HOME}/.docker/sbx/bin" >> "$GITHUB_PATH"

      - name: Verify sbx installation
        run: sbx version

      - name: Set up Secret Service for sbx login
        # sbx's Linux binary persists credentials via libsecret, which talks
        # to org.freedesktop.secrets over D-Bus. GHA's ubuntu-latest is
        # headless, so no Secret Service is running and `sbx login` blocks.
        # This mirrors the recipe from docker/sbx-kits-contrib e2e.yml (and
        # its root reference in docker/secrets-engine scripts/gnome-keyring):
        #
        #   1. Install gnome-keyring + dbus-daemon.
        #   2. Pre-create ~/.local/share/keyrings/login.keyring as a
        #      passwordless ini stanza so `gnome-keyring-daemon --start`
        #      adopts it instead of prompting via gcr-prompter.
        #   3. Start a session bus (dbus-daemon, not dbus-launch).
        #   4. Start gnome-keyring-daemon's secrets component.
        #   5. Poll until org.freedesktop.secrets is owned on D-Bus.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus

          mkdir -p "$HOME/.local/share/keyrings"
          cat > "$HOME/.local/share/keyrings/login.keyring" <<'KEYRING'
          [keyring]
          display-name=login
          ctime=1750965549
          mtime=0
          lock-on-idle=false
          lock-after=false
          KEYRING

          DBUS_SESSION_BUS_ADDRESS=$(dbus-daemon --session --print-address --fork)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          export DBUS_SESSION_BUS_ADDRESS

          gnome-keyring-daemon --start --components=secrets >/dev/null

          for _ in $(seq 1 50); do
            if gdbus call --session \
                --dest org.freedesktop.DBus \
                --object-path /org/freedesktop/DBus \
                --method org.freedesktop.DBus.GetNameOwner \
                org.freedesktop.secrets >/dev/null 2>&1; then
              echo "Secret Service registered on D-Bus"
              exit 0
            fi
            sleep 0.1
          done
          echo "Timed out waiting for org.freedesktop.secrets to register"
          exit 1

      - name: Sign in to Docker Hub via sbx
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_USERNAME}" ] || [ -z "${DOCKER_PAT}" ]; then
            echo "DOCKER_USERNAME / DOCKER_PAT not configured; cannot run e2e."
            exit 1
          fi
          # Defensive trim: GH preserves any whitespace pasted into the
          # secret editor, and sbx's readPasswordStdin only strips trailing
          # \r\n. Usernames and PATs are alphanumeric + hyphens, so stripping
          # all whitespace can't corrupt a legitimate value.
          USER_CLEAN=$(printf '%s' "$DOCKER_USERNAME" | tr -d '[:space:]')
          TOKEN_CLEAN=$(printf '%s' "$DOCKER_PAT"    | tr -d '[:space:]')
          printf '%s' "$TOKEN_CLEAN" | sbx login --username "$USER_CLEAN" --password-stdin

      - name: Store Docker Hub registry credential (authenticated pulls)
        # Docker Hub rate-limits *anonymous* pulls per IP. On shared GitHub
        # runners that quota is routinely exhausted by other users, so
        # `sbx create` fails while pulling the template image:
        #   "You have reached your unauthenticated pull rate limit."
        # The `sbx login` session above is supposed to authenticate Hub pulls,
        # but in CI the sandbox runtime still fell back to anonymous. Store an
        # explicit host-only Docker Hub registry credential (the sbx CLI uses it
        # to pull templates/kits before sandbox creation) and log the Docker CLI
        # in as well, as a fallback to the Docker credential store.
        # Docs: REGISTRY SECRETS can't be combined with --token/--oauth/--ref.
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          set -euo pipefail
          USER_CLEAN=$(printf '%s' "$DOCKER_USERNAME" | tr -d '[:space:]')
          TOKEN_CLEAN=$(printf '%s' "$DOCKER_PAT"    | tr -d '[:space:]')
          printf '%s' "$TOKEN_CLEAN" | sbx secret set --registry docker.io \
            --username "$USER_CLEAN" --password-stdin
          printf '%s' "$TOKEN_CLEAN" | docker login docker.io \
            --username "$USER_CLEAN" --password-stdin

      - name: Register sandbox secrets (github real, github-maven/anthropic/mammouth/mistral/zai/context7/openrouter/google fake)
        # local-test/local-test-kits.py asserts these global services exist
        # (`sbx secret ls`). github uses the Actions GITHUB_TOKEN so
        # `gh auth status` passes inside the sandbox; github-maven, anthropic,
        # mammouth, mistral, zai, context7, openrouter and google get fake keys — enough to prove the
        # kit's proxy env wiring.
        # `-g` was removed in sbx v0.38 (secrets are global by default);
        # `-f` overwrites an existing entry.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | sbx secret set github
          printf '%s' 'ghp-fake-ci-key' | sbx secret set github-maven -f
          printf '%s' 'sk-ant-fake-ci-key' | sbx secret set anthropic -f
          printf '%s' 'mammouth-fake-ci-key' | sbx secret set mammouth -f
          printf '%s' 'mistral-fake-ci-key' | sbx secret set mistral -f
          printf '%s' 'zai-fake-ci-key' | sbx secret set zai -f
          printf '%s' 'ctx7op-fake-ci-key' | sbx secret set context7 -f
          printf '%s' 'openrouter-fake-ci-key' | sbx secret set openrouter -f
          printf '%s' 'google-fake-ci-key' | sbx secret set google -f
          printf '%s' 'stackoverflow-fake-ci-key' | sbx secret set stackoverflow -f
          printf '%s' 'cloudsmith-fake-ci-key' | sbx secret set cloudsmith -f
          printf '%s' 'sonar-fake-ci-key' | sbx secret set sonarcloud -f

      - name: Pre-create credential bindings (third-party v2 kit)
        # Third-party schemaVersion:"2" kits require an approved credential
        # binding per declared service (apiKey + domains). On a fresh runner
        # nothing has been approved interactively, so write the file first —
        # otherwise the sandbox starts with the credentials withheld.
        run: |
          mkdir -p "$HOME/.config/sbx"
          cat > "$HOME/.config/sbx/credentials.yaml" <<'EOF'
          bindings:
            context7:
              apiKey:
                domains: [context7.com]
            deepseek:
              apiKey:
                domains: [api.deepseek.com]
            mammouth:
              apiKey:
                domains: [api.mammouth.ai]
            mistral:
              apiKey:
                domains: [api.mistral.ai]
            zai:
              apiKey:
                domains: [api.z.ai]
            stackoverflow:
              apiKey:
                domains: [api.stackexchange.com]
            cloudsmith:
              apiKey:
                domains: [api.cloudsmith.io, upload.cloudsmith.io]
            sonarcloud:
              apiKey:
                domains: [sonarcloud.io]
            github-maven:
              apiKey:
                domains: [maven.pkg.github.com]
          EOF

      - name: Initialize global network policy (balanced)
        # On a fresh runner the global policy is uninitialized, which makes
        # `sbx create` fail. `balanced` = default deny with common dev sites
        # allowed; the Docker docs recommend it for CI pipelines. This is a
        # functional e2e (tools/config/startup), not a strict per-domain
        # contract test, so deny-all would only break install commands that
        # need apt/npm/GitHub reachability not declared in the kit's allow
        # list.
        run: sbx policy init balanced

      - name: Run e2e tests (${{ matrix.scenario }})
        env:
          # Feature-tagged images built by the publish jobs; local-test uses them
          # - VIBE_IMAGE_TAG: mistral-vibe scenario (`--kit-arg imageTag=<tag>`)
          # - MAMMOUTH_IMAGE_TAG: mammouth scenario (`--kit-arg imageTag=<tag>`)
          # - OPENCODE_IMAGE_TAG: opencode scenario (`--template docker.io/domboeckli/sbx-opencode-tooling:<tag>`)
          # - CLAUDE_IMAGE_TAG: claude scenario (`--template docker.io/domboeckli/sbx-claude-tooling:<tag>`)
          VIBE_IMAGE_TAG: ${{ needs.build-and-publish-mistral-vibe-image.outputs.version_tag }}
          MAMMOUTH_IMAGE_TAG: ${{ needs.build-and-publish-mammouth-image.outputs.version_tag }}
          OPENCODE_IMAGE_TAG: ${{ needs.build-and-publish-opencode-image.outputs.version_tag }}
          CLAUDE_IMAGE_TAG: ${{ needs.build-and-publish-claude-image.outputs.version_tag }}
        run: python3 local-test/local-test-kits.py ${{ matrix.scenario }} --ci

      - name: Sign out of Docker Hub
        if: always()
        run: sbx logout --yes || true
