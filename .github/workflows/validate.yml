name: Validate Kit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Docker sbx CLI
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get install -y docker-sbx

      - name: Validate kit spec
        run: sbx kit validate .

      - name: Check download URLs are reachable
        run: |
          set -e
          echo "Checking Liberica JDK…"
          curl -fsSL -o /dev/null --max-time 10 \
            "https://github.com/bell-sw/Liberica/releases/download/25.0.4+9/bellsoft-jdk25.0.4+9-linux-amd64.tar.gz"

          echo "Checking Maven…"
          curl -fsSL -o /dev/null --max-time 10 \
            "https://dlcdn.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz"

          echo "Checking Docker CLI…"
          curl -fsSL -o /dev/null --max-time 10 \
            "https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz"

          echo "Checking kubectl stable version…"
          KUBE_VER=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
          echo "stable: $KUBE_VER"
          curl -fsSL -o /dev/null --max-time 10 \
            "https://dl.k8s.io/release/$KUBE_VER/bin/linux/amd64/kubectl"
