name: Validate Kit

on:
  push:
  pull_request:
  schedule:
    # Nightly at 03:00 UTC; e2e.yml runs at 03:05 so validation finishes first.
    - cron: "0 3 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Sandbox-Template-Version (gepinnt, beide Kits): gilt fuer opencode-docker (OpenCode +
      # Mammouth) und claude-code-docker (Claude Home), die in Lockstep gleiche Versionsnummern
      # tragen. Source of Truth fuer die --template-Pins der Mixin-Kits und das Mammouth-spec-Image;
      # Updates via Renovate (customManager docker/sandbox-templates in .github/renovate.json).
      TEMPLATE_VERSION: 0.7.0
      # sbx >= v0.47.0 refuses `sbx kit validate` without a Docker account
      # session ("not signed in to Docker"); that session needs a Secret Service
      # on the headless runner (see the setup step below). Fork PRs get no
      # secrets, so validation is skipped there rather than failed on a secret
      # a contributor cannot be given (mirrors docker/sbx-kits-contrib).
      CAN_VALIDATE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Download sbx (pinned version)
        # sbx-Version ist gepinnt (SBX_VERSION), Updates via Renovate
        # (customManager docker/sbx-releases in .github/renovate.json).
        env:
          SBX_VERSION: v0.47.0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "using sbx ${SBX_VERSION}"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://github.com/docker/sbx-releases/releases/download/${SBX_VERSION}/DockerSandboxes-linux.tar.gz" \
            -o /tmp/DockerSandboxes-linux.tar.gz
          tar xzf /tmp/DockerSandboxes-linux.tar.gz -C /tmp

      - name: Install sbx
        run: |
          set -euo pipefail
          sudo PREFIX="${HOME}/.docker/sbx" /tmp/docker-sbx/install.sh
          echo "${HOME}/.docker/sbx/bin" >> "$GITHUB_PATH"

      - name: Verify sbx installation
        run: sbx version

      - name: Set up Secret Service for the sbx secret store
        # sbx's Linux binary persists credentials/secrets via libsecret, which talks
        # to org.freedesktop.secrets over D-Bus. GHA's ubuntu-latest is headless,
        # so no Secret Service is running and `sbx login` blocks. Same recipe as
        # e2e.yml (adapted from docker/sbx-kits-contrib).
        if: env.CAN_VALIDATE == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus

          mkdir -p "$HOME/.local/share/keyrings"
          cat > "$HOME/.local/share/keyrings/login.keyring" <<'KEYRING'
          [keyring]
          display-name=login
          ctime=1750965549
          mtime=0
          lock-on-idle=false
          lock-after=false
          KEYRING

          DBUS_SESSION_BUS_ADDRESS=$(dbus-daemon --session --print-address --fork)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          export DBUS_SESSION_BUS_ADDRESS

          gnome-keyring-daemon --start --components=secrets >/dev/null

          for _ in $(seq 1 50); do
            if gdbus call --session \
                --dest org.freedesktop.DBus \
                --object-path /org/freedesktop/DBus \
                --method org.freedesktop.DBus.GetNameOwner \
                org.freedesktop.secrets >/dev/null 2>&1; then
              echo "Secret Service registered on D-Bus"
              exit 0
            fi
            sleep 0.1
          done
          echo "Timed out waiting for org.freedesktop.secrets to register"
          exit 1

      - name: Sign in to Docker via sbx
        # sbx v0.47.0+ requires a Docker account session for `sbx kit validate`
        # ("not signed in to Docker"), independent of which registry images come
        # from. Distinct from the registry credential used by the e2e scenarios.
        if: env.CAN_VALIDATE == 'true'
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_USERNAME}" ] || [ -z "${DOCKER_PAT}" ]; then
            echo "DOCKER_USERNAME / DOCKER_PAT not configured; cannot validate."
            exit 1
          fi
          USER_CLEAN=$(printf '%s' "$DOCKER_USERNAME" | tr -d '[:space:]')
          TOKEN_CLEAN=$(printf '%s' "$DOCKER_PAT"    | tr -d '[:space:]')
          printf '%s' "$TOKEN_CLEAN" | sbx login --username "$USER_CLEAN" --password-stdin

      - name: Validate OpenCode agent kit spec
        if: env.CAN_VALIDATE == 'true'
        run: sbx kit validate ./opencode-agent/

      - name: Validate Mammouth agent kit spec
        if: env.CAN_VALIDATE == 'true'
        run: sbx kit validate ./mammouth-agent/

      - name: Validate Mistral Vibe agent kit spec
        if: env.CAN_VALIDATE == 'true'
        run: sbx kit validate ./mistral-vibe-agent/

      - name: Sign out of Docker Hub via sbx
        if: always() && env.CAN_VALIDATE == 'true'
        run: sbx logout --yes || true

      - name: Check install-script copies are in sync
        # setup.install konsumiert die Skripte aus files/home/.local/bin/ (alle Kits);
        # alle Kit-Kopien muessen identisch sein (edit target = eine Kopie, dann die
        # anderen per cp synchronisieren; Renovate aktualisiert alle gemeinsam).
        run: |
          set -euo pipefail
          for f in install-tooling.sh install-tooling-user.sh mcp-check.sh install-apt-packages.sh; do
            cmp "opencode-agent/files/home/.local/bin/$f" "mammouth-agent/files/home/.local/bin/$f"
            cmp "opencode-agent/files/home/.local/bin/$f" "mistral-vibe-agent/files/home/.local/bin/$f"
          done

      - name: Check Mistral Vibe image tag matches the Dockerfile pin
        # spec.yaml args.imageTag.default muss exakt den VIBE_VERSION-Pin aus dem Dockerfile
        # spiegeln (Renovate aktualisiert beide gemeinsam, customManager in renovate.json).
        run: |
          set -euo pipefail
          version=$(grep -oE 'ARG VIBE_VERSION=[0-9]+(\.[0-9]+)+' mistral-vibe-agent/Dockerfile \
            | head -1 | cut -d= -f2)
          default=$(grep -oE 'default: "[0-9]+(\.[0-9]+)+"' mistral-vibe-agent/spec.yaml \
            | head -1 | grep -oE '[0-9]+(\.[0-9]+)+')
          echo "VIBE_VERSION=${version}  spec args.imageTag.default=${default}"
          test "$version" = "$default"

      - name: Report status to Codeberg
        # GitHub Actions is the execution host (reliable runners); report the outcome back to the
        # canonical Codeberg commit so Codeberg commits/PRs show the check (Forgejo commit status API).
        # Requires repo secret CODEBERG_STATUS_TOKEN (Codeberg PAT, scope `write:repository`).
        # Without the secret this step is a no-op.
        if: ${{ always() }}
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_STATUS_TOKEN }}
          STATE: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # For pull_request events github.sha is the synthetic merge commit (absent on Codeberg);
          # use the PR head SHA then, else the pushed commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${CODEBERG_TOKEN}" ]; then
            echo "CODEBERG_STATUS_TOKEN not set - skipping Codeberg status report."
            exit 0
          fi
          state="failure"
          if [ "${STATE}" = "success" ]; then state="success"; fi
          code=$(curl -sS -o /tmp/statusresp -w '%{http_code}' -X POST \
            -H "Authorization: token ${CODEBERG_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://codeberg.org/api/v1/repos/dboeckli/opencode-sandbox-kit/statuses/${SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"github-actions/validate\",\"description\":\"GitHub Actions (Validate Kit)\",\"target_url\":\"${TARGET_URL}\"}" || echo "000")
          echo "Codeberg commit status -> HTTP ${code} (${state})"
          case "${code}" in
            2*) ;;
            *) cat /tmp/statusresp 2>/dev/null || true ;;
          esac