name: Validate Kit

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Docker sbx CLI
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get install -y docker-sbx

      - name: Validate kit spec
        run: sbx kit validate .

      - name: Validate Mammouth agent kit spec
        run: sbx kit validate ./mammouth-agent/