name: Build and publish Mistral Vibe image

# Builds and publishes the pinned `docker.cloudsmith.io/dboeckli/sbx/sbx-mistral-vibe` image that the
# `mistral-vibe-agent` sandbox kit references (spec.yaml `sandbox.image`, via the
# `imageTag` kit arg).
#
# The image bakes a pinned Mistral Vibe version on top of the versioned
# `shell-docker` sandbox template (Docker Engine inside the sandbox), following
# https://docs.docker.com/guides/mistral-vibe-sandbox/.
# Vibe is not a pre-built docker/sandbox-templates agent, so the kit ships its
# own image instead of installing the agent at sandbox build time.
#
# This workflow is both directly dispatchable and a reusable workflow
# (`workflow_call`). The `e2e.yml` workflow calls it before the scenario matrix,
# so the image exists for the `mistral-vibe` e2e scenario on every push/PR/weekly
# run. Manual runs use `workflow_dispatch`.
#
# Tags (the image tag must stay a valid Docker tag, so the timestamp is a semver
# prerelease identifier, not build metadata — `+` is not allowed in a tag):
#   - master / main: `<VIBE_VERSION>` (release tag) plus `latest`
#   - feature/PR:    `<VIBE_VERSION>-<branch-slug>.<YYYYMMDDHHMMSS>` (semver
#                    prerelease) plus the moving tag `<branch-slug>`
#
# Multi-arch (linux/amd64 + linux/arm64) via NATIVE runners: `uv tool install`
# does not run under QEMU arm64 emulation (buildx exit 1), so each arch is built
# on its own runner (`ubuntu-latest` / `ubuntu-24.04-arm`). The architecture goes
# into the repository NAME (`<name>-amd64` / `<name>-arm64`), keeping the tag
# clean; the two are combined into one manifest list with
# `docker buildx imagetools create` under the plain `<name>`.

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to the configured registry (off = build only)"
        type: boolean
        default: true
  workflow_call:
    inputs:
      push:
        description: "Push the image to the configured registry (off = build only)"
        type: boolean
        default: true
    outputs:
      version_tag:
        description: "Image version tag that was built/pushed"
        value: ${{ jobs.prepare.outputs.version_tag }}

permissions:
  contents: read

# Zentraler Registry-Umschalter: Repo-Variable IMAGE_PREFIX (voller Prefix ohne Image-Namen).
#   Cloudsmith (Default): docker.cloudsmith.io/dboeckli/sbx
#   Docker Hub:           docker.io/<dockerhub-user>   (z. B. docker.io/domboeckli)
# Umschalten = Repo-Variable IMAGE_PREFIX setzen; zurueck = Variable loeschen (Default).
env:
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || 'docker.cloudsmith.io/dboeckli/sbx' }}
  IMAGE_NAME: sbx-mistral-vibe

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.tags.outputs.version_tag }}
      extra_tag: ${{ steps.tags.outputs.extra_tag }}
      image_prefix: ${{ steps.tags.outputs.image_prefix }}
      pin: ${{ steps.tags.outputs.pin }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tags from the Vibe pin and the branch
        id: tags
        run: |
          set -euo pipefail
          echo "image_prefix=${IMAGE_PREFIX}" >> "$GITHUB_OUTPUT"
          pin=$(grep -oE 'ARG VIBE_VERSION=[0-9]+(\.[0-9]+)+' mistral-vibe-agent/Dockerfile \
            | head -1 | cut -d= -f2)
          if [ -z "$pin" ]; then
            echo "VIBE_VERSION pin not found in mistral-vibe-agent/Dockerfile" >&2
            exit 1
          fi
          spec_default=$(grep -oE 'default: "[0-9]+(\.[0-9]+)+"' mistral-vibe-agent/spec.yaml \
            | head -1 | grep -oE '[0-9]+(\.[0-9]+)+')
          if [ "$spec_default" != "$pin" ]; then
            echo "spec.yaml args.imageTag.default ($spec_default) != Dockerfile pin ($pin)" >&2
            exit 1
          fi
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ "$ref" = "master" ] || [ "$ref" = "main" ]; then
            version_tag="$pin"
            extra_tag="latest"
          else
            slug=$(printf '%s' "$ref" | tr '[:upper:]' '[:lower:]' \
              | sed -E 's#[^a-z0-9_.-]+#-#g; s#^-+##; s#-+$##')
            ts=$(date -u +%Y%m%d%H%M%S)
            version_tag="${pin}-${slug}.${ts}"
            extra_tag="$slug"
          fi
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"
          echo "extra_tag=$extra_tag" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "version_tag=$version_tag extra_tag=$extra_tag"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub (base image pulls / Docker Hub push)
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to Cloudsmith (image push)
        if: ${{ inputs.push && startsWith(env.IMAGE_PREFIX, 'docker.cloudsmith.io') }}
        uses: docker/login-action@v4
        with:
          registry: docker.cloudsmith.io
          username: ${{ vars.CLOUDSMITH_USERNAME }}
          password: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: mistral-vibe-agent
          platforms: ${{ matrix.platform }}
          # Keine provenance/SBOM-Attestations: die erzeugen pro Build zusaetzliche
          # untagged Attestation-Manifeste (Package-Bloat); fuer die Tooling-Images nicht noetig.
          provenance: false
          sbom: false
          push: ${{ inputs.push }}
          # Branch/PR builds (push: false) laden das Image in den lokalen Daemon, damit der
          # Verify-Step unten die eingebackene Version pruefen kann (einzelne Plattform je
          # Matrix-Eintrag -> --load erlaubt; bei push: true nicht kombinierbar).
          load: ${{ ! inputs.push }}
          tags: ${{ needs.prepare.outputs.image_prefix }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:${{ needs.prepare.outputs.version_tag }}

      - name: Verify baked Vibe version (${{ matrix.arch }})
        # Auf Branches/PRs (push: false) ist dies der einzige Ort, an dem das *frisch gebaute*
        # Image geprueft wird: der e2e-Szenario-Job zieht auf Branches nur das publizierte
        # Master-Image (`latest`), nicht das Branch-Image. Die Pin-Assertion gehoert daher zum
        # Artefakt. Auf master/schedule prueft der e2e-Szenario-Job das `<pin>`-Image.
        if: ${{ ! inputs.push }}
        env:
          PIN: ${{ needs.prepare.outputs.pin }}
          IMAGE: ${{ needs.prepare.outputs.image_prefix }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:${{ needs.prepare.outputs.version_tag }}
        run: |
          set -euo pipefail
          installed=$(docker run --rm --entrypoint vibe "$IMAGE" --version \
            | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)
          echo "image=$IMAGE installed=$installed pin=$PIN"
          if [ "$installed" != "$PIN" ]; then
            echo "baked Vibe version ($installed) != pin ($PIN)" >&2
            exit 1
          fi

  merge:
    needs: [prepare, build]
    if: ${{ inputs.push }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub (Docker Hub push)
        if: ${{ !startsWith(env.IMAGE_PREFIX, 'docker.cloudsmith.io') }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to Cloudsmith (image push)
        if: ${{ startsWith(env.IMAGE_PREFIX, 'docker.cloudsmith.io') }}
        uses: docker/login-action@v4
        with:
          registry: docker.cloudsmith.io
          username: ${{ vars.CLOUDSMITH_USERNAME }}
          password: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Create multi-arch manifest list
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
          EXTRA_TAG: ${{ needs.prepare.outputs.extra_tag }}
        run: |
          set -euo pipefail
          image="${{ needs.prepare.outputs.image_prefix }}/${{ env.IMAGE_NAME }}"
          # Cloudsmith ist eventual-consistent: direkt nach dem per-arch Push sind Config-/Layer-
          # Blobs kurzzeitig nicht abrufbar -> Retry mit Backoff.
          retry() {
            local n=0 max=6
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then return 1; fi
              echo "retry $n/$max: $*" >&2
              sleep $((n * 5))
            done
          }
          retry docker buildx imagetools create \
            -t "${image}:${VERSION_TAG}" \
            "${image}-amd64:${VERSION_TAG}" \
            "${image}-arm64:${VERSION_TAG}"
          if [ -n "${EXTRA_TAG}" ]; then
            retry docker buildx imagetools create \
              -t "${image}:${EXTRA_TAG}" \
              "${image}:${VERSION_TAG}"
          fi
          retry docker buildx imagetools inspect "${image}:${VERSION_TAG}"
