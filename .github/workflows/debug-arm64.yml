name: debug arm64 (temporary)

# TEMPORARY diagnostic: build the Vibe image on a native arm64 runner and post
# the build output to issue #116 (CI logs are not reachable from the agent
# sandbox). Delete this workflow once the arm64 failure is understood.

on:
  push:
    paths:
      - ".github/workflows/debug-arm64.yml"

permissions:
  contents: read
  issues: write

jobs:
  debug:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build (capture output)
        id: build
        continue-on-error: true
        run: |
          set +e
          docker build --progress=plain -t vibe-arm64-debug ./mistral-vibe-agent > /tmp/build.log 2>&1
          echo "exit=$?"
          tail -n 120 /tmp/build.log

      - name: Post build log to issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### arm64 debug build log (outcome=${{ steps.build.outcome }})"
            echo '```'
            tail -n 120 /tmp/build.log
            echo '```'
          } > /tmp/comment.md
          gh issue comment 116 --repo "${{ github.repository }}" --body-file /tmp/comment.md
