name: Cleanup Cloudsmith Feature Images
run-name: >
  ${{ github.workflow }}: ${{ github.event_name }} for ${{ github.ref_name }} by @${{ github.actor }}

# Löscht Feature-Branch-Image-Snapshots aus dem Cloudsmith-Repo `dboeckli/sbx`.
# Tag-Muster `<basever>-<branch-slug>.<YYYYMMDDHHMMSS>` (+ Moving-Tag `<slug>`).
# Master-Images (`<basever>` + `latest`) bleiben immer erhalten.
#
# Auslöser:
#   - workflow_call: von e2e.yml NACH Build+e2e aufgerufen (bei push(master)/schedule) ->
#     deterministisch nach dem Build, da GitHub `schedule`-Runs stark verzögert.
#     Bei push(master) werden Feature-Images komplett gelöscht (MAX_AGE_DAYS=0).
#   - schedule (nightly 04:25 UTC): Fallback; verwaiste Branch-Snapshots älter als MAX_AGE_DAYS löschen
#   - workflow_dispatch: manuell, mit dry-run (Default an) + max-age-days + purge-recycle-bin
# Hinweis: bewusst KEIN direkter `push`-Trigger mehr — der lief beim master-Push VOR dem
# Build (und zusätzlich chained) und damit doppelt/zu früh.
# Analog zu spring-6-rest-mvc (`cleanup-cloudsmith.yml`).
#
# Zusätzlich wird der **Recycle Bin** geleert (hard delete): soft-gelöschte Packages zählen
# 7 Tage weiter gegen das Storage-Kontingent (Codeberg-OSS 50 GB). `purge-recycle-bin` steuert
# das (Default an; bei workflow_dispatch abschaltbar). Siehe .github/workflows/scripts/purge-cloudsmith-recycle-bin.py.

on:
  schedule:
    - cron: '25 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        default: true
        description: 'Nur auflisten, nicht löschen'
      max-age-days:
        type: number
        default: 1
        description: 'Nur älter als X Tage löschen'
      purge-recycle-bin:
        type: boolean
        default: true
        description: 'Recycle Bin endgültig löschen (Storage freigeben)'
  # Reusable: wird von e2e.yml als letzter Job aufgerufen (Cleanup nach dem Build).
  workflow_call:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: List & delete feature-branch image snapshots
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          OWNER: dboeckli
          REPO: sbx
          PACKAGE: sbx-
          # via workflow_call bei master-push (event_name=push) = 0 (alles löschen); sonst max-age-days bzw. 1
          MAX_AGE_DAYS: ${{ github.event_name == 'push' && '0' || (inputs.max-age-days != '' && inputs.max-age-days || 1) }}
          # Nur manuelle Runs sind Dry-Run-fähig; schedule + workflow_call laufen scharf
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run == true }}
        run: python3 .github/workflows/scripts/cleanup-cloudsmith.py

      - name: Purge recycle bin (hard delete, reclaim storage)
        # Soft-gelöschte Packages zählen 7 Tage weiter; endgültig löschen gibt Storage frei.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.purge-recycle-bin }}
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          OWNER: dboeckli
          REPO: sbx
          # Nur manuelle Runs sind Dry-Run-fähig; schedule + workflow_call laufen scharf
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run == true }}
        run: python3 .github/workflows/scripts/purge-cloudsmith-recycle-bin.py
