schemaVersion: "2"
kind: mixin
name: opencode-agent
displayName: "OpenCode-Konfiguration"
description: "OpenCode, Context7 und IntelliJ MCP"

permissions:
  network:
    allow:
    - opencode.ai
    - "*.opencode.ai"
    - context7.com
    - "*.context7.com"
    # DeepSeek (OpenCode-Modell mit eigenem API-Key)
    - api.deepseek.com
    - "*.deepseek.com"
    # OpenRouter (OpenCode-Zusatz-Provider, API auf openrouter.ai)
    - openrouter.ai
    - "*.openrouter.ai"
    # Google Gemini (OpenCode-Zusatz-Provider, API auf generativelanguage.googleapis.com)
    - generativelanguage.googleapis.com
    # Anthropic (Claude Code)
    - anthropic.com
    - api.anthropic.com
    - "*.anthropic.com"
    - platform.claude.com
    - github.com
    - api.github.com
    - "*.github.com"
    # GitHub Packages Maven (Maven-Registry, Basic-Auth mit klassischem PAT, read:packages)
    - maven.pkg.github.com
    - githubusercontent.com
    - objects.githubusercontent.com
    - "*.githubusercontent.com"
    - models.dev
    - registry.npmjs.org
    - dlcdn.apache.org
    # Apache Camel (Doku, Dependencies)
    - camel.apache.org
    - "*.camel.apache.org"
    # JetBrains Help-Doku (IntelliJ HTTP-Client Feature-Seiten, z. B. www.jetbrains.com/help/idea/)
    - jetbrains.com
    - www.jetbrains.com
    # IntelliJ IDEA MCP Server (Windows Host; MCP-Verbindung via sbx MCP Gateway → localhost:64342/stream,
    # Allow-Eintrag nur für den Startup-Health-Check, der die Host-Erreichbarkeit aus der Sandbox prüft)
    - "localhost:64342"
    - "127.0.0.1:64342"
    - "host.docker.internal:64342"
    # Docker Desktop Kubernetes (kube-apiserver, Host via Docker Desktop DNS)
    - "localhost:6443"
    - "127.0.0.1:6443"
    - "host.docker.internal:6443"
    # Docker Desktop Docker Engine (Daemon-API via TCP, Host via Docker Desktop DNS; DOCKER_HOST=tcp://host.docker.internal:2375)
    - "localhost:2375"
    - "127.0.0.1:2375"
    - "host.docker.internal:2375"
    # Elastic REST-APIs (ELK-Stack im Host-Docker via Docker Compose, Zugriff via host.docker.internal)
    - "localhost:9200"
    - "127.0.0.1:9200"
    - "host.docker.internal:9200"
    - "localhost:5601"
    - "127.0.0.1:5601"
    - "host.docker.internal:5601"
    - "localhost:8200"
    - "127.0.0.1:8200"
    - "host.docker.internal:8200"
    # Elastic REST-APIs (Docker Desktop Kubernetes, NodePort → localhost)
    - "localhost:30920"
    - "127.0.0.1:30920"
    - "localhost:30561"
    - "127.0.0.1:30561"
    - "localhost:30820"
    - "127.0.0.1:30820"
    # Maven Central
    - maven.org
    - repo1.maven.org
    - "*.maven.org"
    # Spring
    - spring.io
    - repo.spring.io
    - "*.spring.io"
    - start.spring.io
    # Docker
    - docker.io
    - "*.docker.io"
    - docker.com
    - "*.docker.com"
    - download.docker.com
    - dl.k8s.io
    - get.helm.sh
    # Zusätzliche Container-Registries (Observability / GitHub Packages)
    - docker.elastic.co
    - docker-auth.elastic.co
    - cr.jaegertracing.io
    - ghcr.io
    # Private Maven- & Helm-Repositories
    - repo.repsy.io
    - jitpack.io
    - artifacts.cibseven.org
    - packages.scm-manager.org
    # Cloudsmith (Artifact-Hosting API + Package-Upload + Helm-OCI-Registry)
    - api.cloudsmith.io
    - upload.cloudsmith.io
    - docker.cloudsmith.io
    - dl.cloudsmith.io
    # Cloudflare R2 (Object Storage; Multi-Level-Wildcard für Blob-Hosts wie docker-registry-production.<hash>.r2.cloudflarestorage.com)
    - "**/*.r2.cloudflarestorage.com"
    # Liberica JDK (Renovate Versions-API)
    - api.bell-sw.com
    # Ubuntu apt (archive.ubuntu.com for amd64, ports.ubuntu.com for arm64)
    - archive.ubuntu.com
    - security.ubuntu.com
    - ports.ubuntu.com
    # MongoDB apt (Helm-Test-Pod)
    - repo.mongodb.org
    # Python / PyPI
    - pypi.org
    - files.pythonhosted.org
    # Skills CLI
    - add-skill.vercel.sh
    # Web search (last resort, allow-list for websearch/webfetch provider)
    - "*.exa.ai"
    # Stack Overflow API (Fallback-Quelle bei spezifischen Fehlermeldungen)
    - api.stackexchange.com

credentials:
  - service: deepseek
    description: "DeepSeek API-Key (https://platform.deepseek.com/api_keys)"
    apiKey:
      name: DEEPSEEK_API_KEY
      proxyManaged: true
      inject:
        - domain: api.deepseek.com
          header: Authorization
          format: "Bearer %s"
  - service: context7
    description: "Context7 API-Key (https://context7.com/dashboard)"
    apiKey:
      name: CONTEXT7_API_KEY
      proxyManaged: true
      inject:
        - domain: context7.com
          header: Authorization
          format: "Bearer %s"
  - service: stackoverflow
    description: "Stack Overflow API-Key (https://stackapps.com/applications)"
    apiKey:
      name: STACKOVERFLOW_API_KEY
      proxyManaged: true
      inject:
        - domain: api.stackexchange.com
          header: Authorization
          format: "Bearer %s"
  - service: cloudsmith
    description: "Cloudsmith API-Key (https://cloudsmith.io/user/settings/api-keys/)"
    apiKey:
      name: CLOUDSMITH_API_KEY
      proxyManaged: true
      inject:
        - domain: api.cloudsmith.io
          header: X-Api-Key
          format: "%s"
        - domain: upload.cloudsmith.io
          header: X-Api-Key
          format: "%s"
  - service: github-maven
    description: "GitHub Packages Maven — klassisches PAT (nur read:packages, https://github.com/settings/tokens)"
    apiKey:
      name: GITHUB_MAVEN_TOKEN
      proxyManaged: true
      inject:
        - domain: maven.pkg.github.com
          header: Authorization
          format: "Bearer %s"

setup:
  install:
    - command: "npm_config_bin_links=true npm install -g ctx7"
      description: Install ctx7 (docs-as-a-service CLI)
    - command: "npm_config_bin_links=true npm install -g skills"
      description: Install skills (vercel-labs CLI)
    - command: "npm_config_bin_links=true npm install -g prettier"
      description: Install prettier
    - command: "npm_config_bin_links=true npm install -g renovate"
      description: Install renovate
    - command: "bash /home/agent/.local/bin/install-apt-packages.sh"
      description: Install apt packages (jq, python3, pip, python3-yaml) — retries while the template's apt-get holds the dpkg lock; source files/home/.local/bin/install-apt-packages.sh
    - command: "bash /home/agent/.local/bin/install-tooling.sh shfmt"
      description: Install shfmt — source files/home/.local/bin/install-tooling.sh
    - command: "bash /home/agent/.local/bin/install-tooling.sh jdk"
      description: Install Liberica JDK — source files/home/.local/bin/install-tooling.sh
    - command: "bash /home/agent/.local/bin/install-tooling.sh maven"
      description: Install Apache Maven — source files/home/.local/bin/install-tooling.sh
    - command: "bash /home/agent/.local/bin/install-tooling.sh docker"
      description: Install Docker CLI — source files/home/.local/bin/install-tooling.sh
    - command: "bash /home/agent/.local/bin/install-tooling.sh compose"
      description: Install Docker Compose plugin — source files/home/.local/bin/install-tooling.sh
    - command: "bash /home/agent/.local/bin/install-tooling.sh kubectl"
      description: Install kubectl — source files/home/.local/bin/install-tooling.sh
    - command: "bash /home/agent/.local/bin/install-tooling.sh helm"
      description: Install Helm v3 — source files/home/.local/bin/install-tooling.sh
    - command: "bash /home/agent/.local/bin/install-tooling.sh helm4"
      description: Install Helm v4 (as helm4) — source files/home/.local/bin/install-tooling.sh
    - command: "bash /home/agent/.local/bin/install-tooling-user.sh"
      user: "1000"
      description: Install agent-user tooling (skills + Claude statusline) — source files/home/.local/bin/install-tooling-user.sh
    - command: "bash /home/agent/.local/bin/write-managed-settings.sh"
      description: Write managed-settings.json to /etc/claude-code — highest precedence, not overwritten by the template (statusLine + PreToolUse/SessionStart hooks always configured at session start); source files/home/.local/bin/write-managed-settings.sh
  startup:
    - command:
        - bash
        - -c
        - |
          if [ -n "$PROXY_CA_CERT_B64" ]; then
            echo "$PROXY_CA_CERT_B64" | base64 -d > /tmp/proxy-ca.crt 2>/dev/null || true
          fi
          CA=/tmp/proxy-ca.crt
          [ -s "$CA" ] || CA=/usr/local/share/ca-certificates/proxy-ca.crt
          KS="${JAVA_HOME:-/usr/local/java}/lib/security/cacerts"
          ok=0
          for i in $(seq 1 300); do
            if [ -f "$CA" ] && [ -f "$KS" ] && command -v keytool >/dev/null 2>&1; then
              keytool -delete -alias proxy-ca -keystore "$KS" -storepass changeit >/dev/null 2>&1 || true
              if keytool -importcert -noprompt -alias proxy-ca -file "$CA" -keystore "$KS" -storepass changeit >/dev/null 2>&1; then
                echo "proxy-ca in JDK cacerts importiert (Quelle: $CA)"
                ok=1
              else
                echo "FEHLER: proxy-ca Import in JDK cacerts fehlgeschlagen"
              fi
              break
            fi
            sleep 1
          done
          [ "$ok" = 1 ] || echo "proxy-ca Import nach 300s uebersprungen (KS=$([ -f "$KS" ] && echo da || echo fehlt), CA=$([ -f "$CA" ] && echo da || echo fehlt))"
      user: "0"
      description: Import proxy CA into the JDK cacerts so Java/Maven trust the sandbox proxy TLS interception (required for Bearer credential injection into Maven builds)
    - command:
        - python3
        - -c
        - |
          import glob, os
          path = os.path.expanduser('~/.m2/settings.xml')
          os.makedirs(os.path.dirname(path), exist_ok=True)
          content = '''<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <proxies>
              <proxy>
                <id>sbx-proxy</id>
                <active>true</active>
                <protocol>http</protocol>
                <host>gateway.docker.internal</host>
                <port>3128</port>
                <nonProxyHosts>localhost|127.0.0.1|::1</nonProxyHosts>
              </proxy>
            </proxies>
            <servers>
              <server>
                <id>github</id>
                <username>dboeckli</username>
                <password>${env.GITHUB_MAVEN_TOKEN}</password>
              </server>
            </servers>
          </settings>
          '''
          host_repos = []
          for _pat in ('/c/Users/*/.m2/repository', '/c/*/maven-repo', '/c/*/m2-repository'):
              host_repos = [p for p in glob.glob(_pat) if os.path.isdir(p)]
              if host_repos:
                  break
          if host_repos:
              url = 'file://' + host_repos[0]
              profiles = (
                  '  <profiles>\n'
                  '    <profile>\n'
                  '      <id>host-m2-cache</id>\n'
                  '      <repositories>\n'
                  '        <repository>\n'
                  '          <id>host-cache</id>\n'
                  '          <url>' + url + '</url>\n'
                  '          <releases><enabled>true</enabled></releases>\n'
                  '          <snapshots><enabled>false</enabled></snapshots>\n'
                  '        </repository>\n'
                  '      </repositories>\n'
                  '    </profile>\n'
                  '  </profiles>\n'
                  '  <activeProfiles>\n'
                  '    <activeProfile>host-m2-cache</activeProfile>\n'
                  '  </activeProfiles>'
              )
              content = content.replace('</settings>', profiles + '</settings>')
          with open(path, 'w') as f:
              f.write(content)
      user: "1000"
      description: Write ~/.m2/settings.xml with sandbox proxy routing (<proxies> gateway.docker.internal:3128) and GitHub Packages Maven credentials — password references ${env.GITHUB_MAVEN_TOKEN} (proxy-managed sentinel); Maven must route through the proxy (settings proxies) so the proxy can MITM and inject the Bearer PAT on maven.pkg.github.com. Wenn ein read-only Host-Maven-Cache gemountet ist (/c/Users/*/.m2/repository), wird zusaetzlich ein <repository> 'host-cache' (file://, snapshots disabled) in einem aktiven Profil ergaenzt — Maven nutzt den Host-Cache vor den echten Remotes
    - command:
        - python3
        - -c
        - |
          import json, os
          sf = os.path.expanduser('~/.claude/settings.json')
          kf = os.path.expanduser('~/.claude/settings.kit.json')
          if not (os.path.exists(sf) and os.path.exists(kf)):
              exit(0)
          with open(sf) as f: base = json.load(f)
          with open(kf) as f: kit = json.load(f)
          def merge(b, o):
              r = dict(b)
              for k, v in o.items():
                  if k in r and isinstance(r[k], dict) and isinstance(v, dict):
                      r[k] = merge(r[k], v)
                  else:
                      r[k] = v
              return r
          with open(sf, 'w') as f:
              json.dump(merge(base, kit), f, indent=2)
      user: "1000"
      description: Re-apply kit settings after template overwrite — Python merge (faster than jq, handles arrays correctly)
    - command:
        - python3
        - /home/agent/.local/bin/regenerate-kubeconfig.py
      user: "1000"
      description: Regenerate ~/.kube/config from the read-only host kubeconfig mount (Docker Desktop Kubernetes) — idempotent, no-op without mount

environment:
  variables:
    JAVA_HOME: "/usr/local/java"
    ANTHROPIC_DEFAULT_SONNET_MODEL: "claude-sonnet-4-6"
    ANTHROPIC_MODEL: "claude-sonnet-4-6"
    npm_config_bin_links: "false"